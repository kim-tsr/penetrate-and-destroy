# Exemple NON chiffré des clés attendues dans secrets/backup-s3.sops.yaml (optionnel).
# Lu par scripts/backup.sh et scripts/restore.sh pour l'export vers un S3 externe.
# Sans ce fichier ni variables PAD_BACKUP_S3_*, les sauvegardes restent locales et dans Garage.
endpoint: "https://s3.CHANGEME.example.net"
region: "CHANGEME"
bucket: "CHANGEME"
prefix: "pad-backups"
access_key_id: "CHANGEME"
secret_access_key: "CHANGEME"
