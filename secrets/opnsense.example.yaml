# Exemple NON chiffré des clés attendues dans secrets/opnsense.sops.yaml.
# Lu par les stacks tofu 10-router (rendu de config.xml) et 60-opnsense-rules (provider browningluke/opnsense).
#
# Génération :
#   root_password_bcrypt : htpasswd -nbBC 10 "" 'motdepasse' | cut -d: -f2   (préfixe $2y$)
#   api_key              : openssl rand -base64 60 | tr -d '\n/+=' | cut -c1-80
#   api_secret           : openssl rand -base64 60 | tr -d '\n/+=' | cut -c1-80
#   api_secret_crypt     : mkpasswd -m sha-512 'valeur de api_secret'   (préfixe $6$, stocké tel quel dans config.xml)
root_password_bcrypt: "CHANGEME"
api_key: "CHANGEME"
api_secret: "CHANGEME"
api_secret_crypt: "CHANGEME"
