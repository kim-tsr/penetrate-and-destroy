# Exemple NON chiffré des clés attendues dans secrets/netbird-agent.sops.yaml.
# Chargé par le rôle ansible netbird-agent (community.sops.load_vars). Ne se renseigne pas à la main :
# `task netbird:sync-keys` (scripts/sopsctl.py netbird-keys-sync) recopie les setup keys créées par la stack tofu 40-netbird.
# Setup key du routing peer de la zone CHALLENGES (LXC nbrouter, groupe pad-routers-challenges).
netbird_agent_setup_key_challenges: "CHANGEME"
# Setup key du routing peer de la zone BASTION (agent sur le LXC warpgate, groupe pad-routers-bastion).
netbird_agent_setup_key_bastion: "CHANGEME"
