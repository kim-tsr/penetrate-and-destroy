# Exemple NON chiffré des clés attendues dans secrets/authentik.sops.yaml.
# Lu par le rôle ansible `authentik` (community.sops.load_vars). Générer chaque valeur avec `openssl rand -base64 48`.
secret_key: "CHANGEME"            # AUTHENTIK_SECRET_KEY : ne JAMAIS changer après le premier démarrage
postgres_password: "CHANGEME"
bootstrap_password: "CHANGEME"    # mot de passe initial du compte akadmin
bootstrap_token: "CHANGEME"       # jeton API de bootstrap (utilisé par tofu 30-authentik)
bootstrap_email: "CHANGEME@CHANGEME.example.net"
