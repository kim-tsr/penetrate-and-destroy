# Exemple NON chiffré de secrets/github-deploy-key.sops.yaml (lu par bootstrap/scripts/gitops.sh).
# Créer le vrai fichier : cp secrets/github-deploy-key.example.yaml secrets/github-deploy-key.sops.yaml && sops -e -i secrets/github-deploy-key.sops.yaml
# Générer la clé : ssh-keygen -t ed25519 -N '' -f deploy_key ; ajouter deploy_key.pub en deploy key (lecture seule) du repo GitHub.
github:
  deploy_key: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    CHANGEME
    -----END OPENSSH PRIVATE KEY-----
