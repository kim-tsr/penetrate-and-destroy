# Exemple NON chiffré des clés attendues dans secrets/monitoring.sops.yaml.
# Lu par le rôle ansible `monitoring-stack` (community.sops.load_vars).
grafana_admin_password: "CHANGEME"      # compte local de secours (la connexion normale passe par Authentik)
grafana_secret_key: "CHANGEME"          # openssl rand -base64 32
grafana_oidc_client_secret: "CHANGEME"  # secret du client OIDC identity.oidc_clients.grafana (créé par tofu 30-authentik)
discord_webhook_url: "https://discord.com/api/webhooks/CHANGEME/CHANGEME"   # receiver Alertmanager Discord
smtp_smarthost: "smtp.CHANGEME.example.net:587"   # receiver Alertmanager email
smtp_from: "alertmanager@CHANGEME.example.net"
smtp_to: "ops@CHANGEME.example.net"
smtp_username: "CHANGEME"
smtp_password: "CHANGEME"
# Optionnels (voir monitoring/README.md)
discord_webhook_url_info: ""                # webhook Discord distinct pour severity=info (vide = webhook principal)
uptime_kuma_watchdog_token: "CHANGEME"      # jeton du moniteur push Watchdog, 32 caractères alphanumériques
uptime_kuma_username: "CHANGEME"            # compte API pour monitoring/uptime-kuma/sync.py
uptime_kuma_password: "CHANGEME"
