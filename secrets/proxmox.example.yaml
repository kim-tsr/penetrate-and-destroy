# Exemple NON chiffré des clés attendues dans secrets/proxmox.sops.yaml.
# Créer le vrai fichier : cp secrets/proxmox.example.yaml secrets/proxmox.sops.yaml && sops -e -i secrets/proxmox.sops.yaml
# L'URL de l'API et l'accès SSH à l'hôte viennent de secrets/site.sops.yaml.
# Lu par les stacks tofu 00-host-network, 10-router, 15-talos-image, 20-services-lxc (provider carlpett/sops).
proxmox:
  # Jeton API au format complet "user@realm!tokenid=uuid" (privilèges VM, LXC, stockage, réseau, Sys.Modify).
  api_token: "CHANGEME@pve!tofu=CHANGEME"
  # "true" tant que l'API garde son certificat auto-signé.
  insecure: "true"
ssh:
  # Clé publique injectée dans les LXC (utilisateur root) pour Ansible.
  ansible_public_key: "ssh-ed25519 CHANGEME ansible@pad"
  # Clé(s) publique(s) admin autorisée(s) sur root OPNsense (SSH depuis bastion et mgmt uniquement).
  admin_public_keys:
    - "ssh-ed25519 CHANGEME admin@pad"
