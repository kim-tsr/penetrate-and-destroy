# Exemple NON chiffré des clés attendues dans secrets/netbird.sops.yaml.
# Chargé par le rôle ansible netbird-server (community.sops.load_vars).
# Secret partagé d'authentification du relay intégré : openssl rand -base64 32
netbird_server_relay_auth_secret: "CHANGEME"
# Clé AES des cookies de session de l'IdP embarqué (16/24/32 octets) : openssl rand -hex 16
netbird_server_session_cookie_key: "CHANGEME"
# Clé de chiffrement des données sensibles du store : openssl rand -base64 32
netbird_server_datastore_key: "CHANGEME"
# Secret du client OIDC "pad-netbird" d'Authentik (identity.oidc_clients.netbird), généré par tofu 30-authentik.
netbird_server_authentik_client_secret: "CHANGEME"
# Mot de passe du compte propriétaire local initial (amorçage ; vider ensuite pour retirer le bloc owner).
netbird_server_owner_password: "CHANGEME"
# Personal Access Token du owner (Dashboard > Settings > Personal Access Tokens), créé après le 1er déploiement.
# Vide ("") au premier passage : la configuration de l'IdP Authentik et des groupes JWT est alors ignorée.
netbird_server_api_token: ""
