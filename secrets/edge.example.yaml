# Exemple NON chiffré des clés attendues dans secrets/edge.sops.yaml.
# Lu par le rôle ansible edge-traefik-crowdsec (community.sops.load_vars).
# Jeton OVH (ACME DNS-01 Traefik) : https://eu.api.ovh.com/createToken/ avec GET/POST/DELETE sur /domain/zone/<domaine>/*
# L'endpoint OVH vient du contrat (acme.ovh_endpoint).
ovh_application_key: "CHANGEME"
ovh_application_secret: "CHANGEME"
ovh_consumer_key: "CHANGEME"
# Clé API du bouncer Traefik auprès de la LAPI CrowdSec (ex. : openssl rand -hex 32).
crowdsec_bouncer_key: "CHANGEME"
