# Exemple NON chiffré des clés attendues dans secrets/site.sops.yaml : les valeurs propres à VOTRE hôte Proxmox.
# Créer le vrai fichier : task secrets:init (ou cp secrets/site.example.yaml secrets/site.sops.yaml && sops -e -i secrets/site.sops.yaml),
# puis le compléter avec `sops secrets/site.sops.yaml`. `task secrets:pending` liste les clés encore vides.
# Lu par tofu (provider sops), Ansible (community.sops) et les scripts (sops -d + yq). Jamais en clair dans Git.

# URL de l'API Proxmox, sans chemin : schéma, hôte et port (ex. https://<hôte>:8006). Requis.
proxmox_url: ""

# Adresse SSH de l'hôte Proxmox (nom DNS ou IP joignable depuis le poste opérateur). Requis.
ssh_host: ""

# Utilisateur SSH sur l'hôte Proxmox (sudo requis pour le rôle Ansible host-tuning). Requis.
ssh_user: ""

wan:
  # Adresse IPv4 publique de la plateforme (enregistrements DNS publics, WAN d'OPNsense). Requis.
  #   wan.mode = routed_ip : IP publique supplémentaire routée vers la VM routeur (portée par OPNsense, en /32).
  #   wan.mode = nat       : IP publique de l'hôte (DNAT nftables vers OPNsense).
  ip: ""
  # Passerelle IPv4 du WAN. Requis en mode routed_ip (passerelle de l'hôte, hors sous-réseau) ; inutilisé en mode nat.
  gateway: ""
  # Adresse MAC dédiée de la NIC WAN du routeur. Facultatif : à renseigner seulement si l'hébergeur l'exige (mode routed_ip).
  mac: ""
