# Exemple NON chiffré des clés attendues dans secrets/authentik-tofu.sops.yaml.
# Lu par le stack tofu 30-authentik (provider goauthentik/authentik via data sops_file).
# URL du provider = https://<hostnames.auth>.<domain> (contrat), aucune clé d'URL ici.
# Jeton API d'un compte de service (ou du jeton de bootstrap, secrets/authentik.sops.yaml: bootstrap_token).
api_token: "CHANGEME"
# Captcha du flow d'inscription des joueurs (Cloudflare Turnstile par défaut ; hCaptcha/reCAPTCHA : captcha_js_url/captcha_api_url).
# Requis tant que captcha_enabled=true (défaut). Pour s'en passer : tofu apply -var captcha_enabled=false.
captcha_public_key: "CHANGEME"
captcha_private_key: "CHANGEME"
