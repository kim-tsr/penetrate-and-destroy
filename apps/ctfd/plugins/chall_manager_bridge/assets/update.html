{% extends "admin/challenges/update.html" %}

{% block value %}
<div class="form-group">
	<label>Valeur</label>
	<input type="number" class="form-control chal-value" name="value" value="{{ challenge.value }}" required>
</div>

<div class="form-group">
	<label>Scénario chall-manager (OCI, tag@digest)</label>
	<input type="text" class="form-control" name="scenario" value="{{ challenge.scenario or '' }}">
</div>

<div class="form-group">
	<label>Configuration additionnelle (JSON)</label>
	<textarea class="form-control" name="instance_config" rows="4">{{ challenge.instance_config }}</textarea>
</div>

<div class="form-row">
	<div class="form-group col-md-4">
		<label>TTL (secondes)</label>
		<input type="number" class="form-control" name="timeout" value="{{ challenge.timeout }}" min="60">
	</div>
	<div class="form-group col-md-4">
		<label>Prolongations max</label>
		<input type="number" class="form-control" name="max_renewals" value="{{ challenge.max_renewals }}" min="0">
	</div>
	<div class="form-group col-md-4">
		<label>Flag par instance</label>
		<select class="custom-select" name="per_instance_flag">
			<option value="false" {% if not challenge.per_instance_flag %}selected{% endif %}>Non</option>
			<option value="true" {% if challenge.per_instance_flag %}selected{% endif %}>Oui</option>
		</select>
	</div>
</div>
{% endblock %}
