---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: chall-manager
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# API chall-manager : appelée par CTFd (plugin chall_manager_bridge) et par le janitor.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chall-manager-ingress
  namespace: chall-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: chall-manager
      app.kubernetes.io/component: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ctfd # contracts: namespaces.ctfd
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: chall-manager-janitor
      ports:
        - { port: 8080, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chall-manager-egress
  namespace: chall-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: chall-manager
      app.kubernetes.io/component: api
  policyTypes: [Egress]
  egress:
    # DNS : porté par la CiliumNetworkPolicy chall-manager-egress-fqdn (filtrage L7 des noms résolus).
    # API Kubernetes (VIP et control planes de la zone prod)
    - to:
        - ipBlock:
            cidr: 10.20.60.0/24 # contracts: zones.prod.cidr
      ports:
        - { port: 6443, protocol: TCP }
    # OTLP gRPC (Tempo)
    - to:
        - ipBlock:
            cidr: 10.20.50.10/32 # contracts: monitoring.otlp_grpc
      ports:
        - { port: 4317, protocol: TCP }
    # Registre OCI des scénarios (Zot interne ou via edge)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: registry # contracts: namespaces.registry
        - ipBlock:
            cidr: 10.20.20.10/32 # contracts: services.edge.ip
      ports:
        - { port: 443, protocol: TCP }
        - { port: 5000, protocol: TCP }
    # Téléchargement des plugins Pulumi : plus de 0.0.0.0/0, voir la CiliumNetworkPolicy ci-dessous.
---
# Egress Internet restreint par FQDN (Cilium) pour les plugins Pulumi.
# Pourquoi pas "pré-installer" : le CLI Pulumi télécharge le plugin de ressource (pulumi-resource-kubernetes) à la 1re
# exécution depuis les releases GitHub ; l'image officielle chall-manager ne l'embarque pas et la rebuilder (image maison
# + CI + digest) coûte plus cher que de la maintenir. Le registre interne (Zot) ne sert pas les plugins Pulumi (pas un
# registre OCI de plugins). Solution retenue : liste FQDN minimale, sur le seul port 443, et filtrage L7 des requêtes DNS
# (seuls ces noms, le registre interne et *.cluster.local sont résolvables : pas de tunnel DNS). Les plugins étant mis en
# cache sur le PVC (PULUMI_HOME), l'egress ne sert qu'au premier lancement et aux changements de version du provider :
# il peut être retiré une fois le cache chaud (voir docs/composants/chall-manager.md).
# Les NetworkPolicy k8s et CiliumNetworkPolicy s'additionnent : la CNP n'ouvre que ce qui est listé ici.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: chall-manager-egress-fqdn
  namespace: chall-manager
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: chall-manager
      app.kubernetes.io/component: api
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: ANY }
          rules:
            dns:
              - matchName: github.com
              - matchName: api.github.com
              - matchName: objects.githubusercontent.com
              - matchName: release-assets.githubusercontent.com
              - matchName: get.pulumi.com
              - matchName: registry.pad.internal # contracts: apps.registry
              - matchPattern: "*.cluster.local"
    - toFQDNs:
        - matchName: github.com
        - matchName: api.github.com
        - matchName: objects.githubusercontent.com
        - matchName: release-assets.githubusercontent.com
        - matchName: get.pulumi.com
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }
---
# Janitor : DNS + API chall-manager + OTLP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: janitor-egress
  namespace: chall-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: chall-manager-janitor
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: chall-manager
              app.kubernetes.io/component: api
      ports:
        - { port: 8080, protocol: TCP }
    - to:
        - ipBlock:
            cidr: 10.20.50.10/32 # contracts: monitoring.otlp_grpc
      ports:
        - { port: 4317, protocol: TCP }
