apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: chall-manager
resources:
  - namespace.yaml
  - rbac.yaml
  - deployment.yaml
  - scaledobject.yaml
  - networkpolicy.yaml
# Secret OCI (chiffré SOPS) : secret.sops.yaml, créé par `task secrets:init` à partir de secret.example.yaml
# (cf. docs/SECRETS.md) ; secret.example.yaml n'est jamais appliqué.
generators:
  - secret-generator.yaml
