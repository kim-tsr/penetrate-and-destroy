# Exemple NON chiffré (valeurs CHANGEME), jamais appliqué. Le vrai fichier `secret.sops.yaml` est chiffré avec SOPS/age
# et déchiffré par ksops (secret-generator.yaml) ; créé par `task secrets:init`.
# Identifiants de pull du registre Zot (utilisateur pad-pull) ; `task secrets:init` les renseigne depuis
# secrets/credentials.sops.yaml. Sans eux, chall-manager tire les scénarios du registre en anonyme (le Secret reste
# facultatif côté Deployment : secretKeyRef optional).
apiVersion: v1
kind: Secret
metadata:
  name: chall-manager-oci
  namespace: chall-manager
type: Opaque
stringData:
  username: CHANGEME
  password: CHANGEME
