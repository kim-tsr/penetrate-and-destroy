# Exemple NON chiffré (valeurs CHANGEME). Le vrai `secret.sops.yaml` est chiffré SOPS/age et déchiffré
# par ksops (secret-generator.yaml) ; créé par `task secrets:init` (valeurs aléatoires ; PAD_SSO_SHARED_SECRET et le mot
# de passe de VALKEY_URL sont recopiés depuis ctfd / valkey), sauf AUTH_AUTHENTIK_SECRET et NETBIRD_API_TOKEN à compléter.
#  - AUTH_SECRET : >= 32 caractères aléatoires (chiffrement des cookies de session Auth.js).
#  - AUTH_AUTHENTIK_SECRET : client secret du provider OIDC `pad-frontend` (sortie du stack tofu 30-authentik).
#  - PAD_SSO_SHARED_SECRET : DOIT valoir le même secret que PAD_SSO_SHARED_SECRET du Secret `ctfd-secrets`
#    (gitops/apps/ctfd), >= 32 caractères ; rotation : poser l'ancienne valeur dans PAD_SSO_SHARED_SECRET_PREVIOUS côté CTFd.
#  - VALKEY_URL : redis://:<mot de passe Valkey>@valkey.storage.svc.cluster.local:6379
#  - METRICS_TOKEN : jeton Bearer de /api/metrics (lu aussi par le ServiceMonitor).
#  - NETBIRD_API_TOKEN : jeton en lecture seule de l'API NetBird (facultatif : sans lui l'état du tunnel reste « inconnu »).
apiVersion: v1
kind: Secret
metadata:
  name: frontend-secrets
  namespace: frontend
type: Opaque
stringData:
  AUTH_SECRET: CHANGEME
  AUTH_AUTHENTIK_SECRET: CHANGEME
  PAD_SSO_SHARED_SECRET: CHANGEME
  VALKEY_URL: CHANGEME
  METRICS_TOKEN: CHANGEME
  NETBIRD_API_TOKEN: CHANGEME
