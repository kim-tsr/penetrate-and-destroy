apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: frontend # contracts: namespaces.frontend
resources:
  - namespace.yaml
  - deployment.yaml
  - scaledobject.yaml
  - ingress.yaml
  - servicemonitor.yaml
  - networkpolicy.yaml
# Secret `frontend-secrets` (chiffré SOPS) : secret.sops.yaml, créé par `task secrets:init` à partir de
# secret.example.yaml (cf. docs/SECRETS.md). Sans lui, les pods restent en CreateContainerConfigError.
generators:
  - secret-generator.yaml
