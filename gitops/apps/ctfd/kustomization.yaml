apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ctfd
resources:
  - namespace.yaml
  - mariadb.yaml
  - deployment.yaml
  - scaledobject.yaml
  - ingress.yaml
  - servicemonitor.yaml
  - networkpolicy.yaml
# Secret `ctfd-secrets` (chiffré SOPS) : secret.sops.yaml, créé par `task secrets:init` à partir de secret.example.yaml
# (cf. docs/SECRETS.md) ; secret.example.yaml n'est jamais appliqué.
generators:
  - secret-generator.yaml
