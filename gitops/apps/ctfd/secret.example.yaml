# Exemple NON chiffré (valeurs CHANGEME), jamais appliqué. Le vrai `secret.sops.yaml` est chiffré SOPS/age et déchiffré
# par ksops (secret-generator.yaml) ; créé par `task secrets:init` (valeurs aléatoires).
# AWS_* : clé S3 Garage (GK + 24 hex / 64 hex), générée une seule fois par `task secrets:init` et recopiée à l'identique
# depuis gitops/platform/garage/secret-s3.sops.yaml ; le Job garage-init l'importe dans Garage (buckets ctfd-uploads et backups).
apiVersion: v1
kind: Secret
metadata:
  name: ctfd-secrets
  namespace: ctfd
type: Opaque
stringData:
  SECRET_KEY: CHANGEME
  DATABASE_PASSWORD: CHANGEME
  MARIADB_ROOT_PASSWORD: CHANGEME
  REDIS_PASSWORD: CHANGEME # même valeur que gitops/platform/valkey (recopiée par `task secrets:init`)
  AWS_ACCESS_KEY_ID: CHANGEME # = garage secret-s3 access_key_id (recopié par `task secrets:init`)
  AWS_SECRET_ACCESS_KEY: CHANGEME # = garage secret-s3 secret_access_key (recopié par `task secrets:init`)
  PAD_SSO_SHARED_SECRET: CHANGEME
  # PAD_SSO_SHARED_SECRET_PREVIOUS: CHANGEME   # facultatif, pendant une rotation
  PAD_INTERNAL_TOKEN: CHANGEME
  PAD_METRICS_TOKEN: CHANGEME
