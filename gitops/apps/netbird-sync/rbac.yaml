apiVersion: v1
kind: ServiceAccount
metadata:
  name: netbird-sync
  labels:
    app.kubernetes.io/name: netbird-sync
    app.kubernetes.io/part-of: penetrate-and-destroy
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: netbird-sync
  labels:
    app.kubernetes.io/name: netbird-sync
rules:
  - apiGroups: [""]
    resources: [services, namespaces]
    verbs: [get, list, watch]
  # Finalizer pad.io/netbird-sync sur les Services d'instances.
  - apiGroups: [""]
    resources: [services]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: netbird-sync
  labels:
    app.kubernetes.io/name: netbird-sync
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: netbird-sync
subjects:
  - kind: ServiceAccount
    name: netbird-sync
    namespace: netbird-sync
---
# Garde-fou : le patch est cluster-wide côté RBAC (un Role ne peut pas filtrer par préfixe de namespace) ;
# l'admission le limite aux Services des namespaces d'instance (inst-*). Une compromission de netbird-sync ne peut
# plus poser de finalizer bloquant sur les Services de la plateforme.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pad-netbird-sync-inst-only
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [services]
  matchConditions:
    - name: from-netbird-sync
      expression: "request.userInfo.username == 'system:serviceaccount:netbird-sync:netbird-sync'"
  validations:
    - expression: "request.namespace.startsWith('inst-')" # contracts: namespaces.instances_prefix
      message: "netbird-sync ne peut modifier que les Services des namespaces inst-*"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pad-netbird-sync-inst-only
spec:
  policyName: pad-netbird-sync-inst-only
  validationActions: [Deny, Audit]
