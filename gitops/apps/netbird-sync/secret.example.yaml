# Exemple NON chiffré (valeurs CHANGEME), jamais appliqué. Le vrai Secret est secret.sops.yaml (SOPS + age), déchiffré
# par ksops (secret-generator.yaml) ; créé par `task secrets:init` puis à compléter (PAT NetBird, domaine).
apiVersion: v1
kind: Secret
metadata:
  name: netbird-sync
type: Opaque
stringData:
  NETBIRD_API_URL: https://vpn.CHANGEME.example.net # contracts: hostnames.vpn + domain
  NETBIRD_API_TOKEN: CHANGEME # PAT du service user netbird-sync (rôle network_admin : groupes, networks, policies, pairs ; voir infra/tofu/stacks/40-netbird/README.md)
  PAD_INTERNAL_TOKEN: CHANGEME # DOIT être identique à PAD_INTERNAL_TOKEN du Secret ctfd-secrets (lecture des membres d'équipe)
