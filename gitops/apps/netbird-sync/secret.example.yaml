# Exemple NON chiffré (valeurs CHANGEME), jamais appliqué. Le vrai Secret est secret.sops.yaml (SOPS + age), déchiffré
# par ksops (secret-generator.yaml) ; créé par `task secrets:init` puis à compléter (PAT NetBird, domaine).
apiVersion: v1
kind: Secret
metadata:
  name: netbird-sync
type: Opaque
stringData:
  NETBIRD_API_URL: https://vpn.CHANGEME.example.net # contracts: hostnames.vpn + domain
  NETBIRD_API_TOKEN: CHANGEME # PAT d'un compte de service NetBird (droits groupes, networks, policies)
