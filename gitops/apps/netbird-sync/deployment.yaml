apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-sync
  annotations:
    checkov.io/skip1: CKV_K8S_38=contrôleur : lit les Pods/Namespaces via l'API Kubernetes avec le jeton de son ServiceAccount (RBAC minimal)
  labels: &labels
    app.kubernetes.io/name: netbird-sync
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: penetrate-and-destroy
    pad.io/zone: prod
spec:
  replicas: 1 # pas d'élection de leader : un seul replica, stratégie Recreate
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: netbird-sync
  template:
    metadata:
      labels: *labels
    spec:
      serviceAccountName: netbird-sync
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: netbird-sync
          # Référence par empreinte obligatoire (Kyverno verify-images, CONVENTIONS.md). Tag et empreinte sont tenus à jour par la
          # PR automatique `ci/pin-image-digests` (images.yml, scripts/pin-image-digests.sh) : ne pas les éditer à la main.
          image: ghcr.io/kim-tsr/pad-netbird-sync:5459b3a@sha256:4972edb7212c32a4fb8b5dbdb7c31cedaf776ac9d2d834ff2223d2cb61650f2a
          args: ["--resync=10m"]
          env:
            - name: NETBIRD_API_URL
              valueFrom: { secretKeyRef: { name: netbird-sync, key: NETBIRD_API_URL } }
            - name: NETBIRD_API_TOKEN
              valueFrom: { secretKeyRef: { name: netbird-sync, key: NETBIRD_API_TOKEN } }
            # Membres d'équipe (rattachement joueur -> groupe NetBird ctf-team-<id>) : endpoint interne de CTFd (pad_teams).
            - { name: CTFD_URL, value: "http://ctfd.ctfd.svc.cluster.local:8000" } # contracts: apps.ctfd.service
            - name: PAD_INTERNAL_TOKEN # = PAD_INTERNAL_TOKEN du Secret ctfd-secrets (même valeur)
              valueFrom: { secretKeyRef: { name: netbird-sync, key: PAD_INTERNAL_TOKEN } }
            - name: NETBIRD_NETWORK_NAME
              value: pad-instances # contracts: netbird.network_name
            - name: NETBIRD_TEAM_GROUP_PREFIX
              value: ctf-team- # contracts: netbird.team_group_prefix
            - name: INSTANCES_NAMESPACE_PREFIX
              value: inst- # contracts: namespaces.instances_prefix
          ports:
            - { name: metrics, containerPort: 8080 }
            - { name: probes, containerPort: 8081 }
          livenessProbe:
            httpGet: { path: /healthz, port: probes }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: probes }
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 48Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: netbird-sync
  labels:
    app.kubernetes.io/name: netbird-sync
spec:
  selector:
    app.kubernetes.io/name: netbird-sync
  ports:
    - { name: metrics, port: 8080, targetPort: metrics }
