# Namespace csi-proxmox : PSS privileged, NetworkPolicy Cilium default-deny + autorisations minimales.
# Héberge le CSI Proxmox et le cloud controller manager Proxmox (gitops/platform/proxmox-ccm), qui partagent le Secret
# proxmox-csi-config (un seul jeton) et la sortie vers l'API Proxmox ci-dessous.
# privileged est imposé par le DaemonSet node du plugin CSI (montages hôte, mount propagation) : un namespace ne peut
# pas panacher les niveaux. Le contrôleur CSI n'en a pas besoin ; surveiller via les labels audit/warn restricted.
---
apiVersion: v1
kind: Namespace
metadata:
  name: csi-proxmox
  labels:
    pad.io/zone: prod
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
---
# Base commune : tout endpoint du namespace est sélectionné (=> default-deny en entrée ET en sortie),
# puis on autorise : trafic intra-namespace, DNS (kube-dns), API Kubernetes, scrape depuis observability.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-baseline
  namespace: csi-proxmox
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: csi-proxmox
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability # contracts: namespaces.monitoring_agents
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: csi-proxmox
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: ANY }
          rules:
            dns:
              - matchPattern: "*"
    - toEntities: [kube-apiserver]
    # API Proxmox (le contrôleur CSI crée, attache et supprime les volumes ; le CCM lit les VM). Hôte en zone MGMT,
    # jeton dans un Secret.
    - toCIDR: ["10.20.10.2/32"] # contracts: host.mgmt_ip
      toPorts:
        - ports:
            - { port: "8006", protocol: TCP } # contracts: flow_ports.proxmox_api
