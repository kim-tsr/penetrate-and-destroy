# Namespace keda : PSS restricted, NetworkPolicy Cilium default-deny + autorisations minimales.
---
apiVersion: v1
kind: Namespace
metadata:
  name: keda
  labels:
    pad.io/zone: prod
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
---
# Base commune : tout endpoint du namespace est sélectionné (=> default-deny en entrée ET en sortie),
# puis on autorise : trafic intra-namespace, DNS (kube-dns), API Kubernetes, scrape depuis observability.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-baseline
  namespace: keda
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: keda
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability # contracts: namespaces.monitoring_agents
    # Appels de l'API server (webhooks d'admission (9443) et API agrégée external.metrics.k8s.io (6443)) : sans cette règle, la default-deny fait échouer toute admission
    # (« failed calling webhook ... context deadline exceeded »).
    - fromEntities: [kube-apiserver, remote-node, host]
      toPorts:
        - ports:
            - { port: "9443", protocol: TCP }
            - { port: "6443", protocol: TCP }
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: keda
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: ANY }
          rules:
            dns:
              - matchPattern: "*"
    - toEntities: [kube-apiserver]
    # Déclencheurs Prometheus des ScaledObject (front, CTFd) : requêtes vers VictoriaMetrics (LXC monitoring). Sans cette
    # sortie, les triggers échouaient (ScaledObject non Ready : Applications frontend et ctfd Degraded).
    - toCIDR:
        - 10.20.50.10/32 # contracts: services.monitoring.ip
      toPorts:
        - ports:
            - { port: "8428", protocol: TCP } # contracts: ports.monitoring.victoriametrics
