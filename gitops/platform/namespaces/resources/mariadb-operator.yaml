# Namespace mariadb-operator : PSS restricted, NetworkPolicy Cilium default-deny + autorisations minimales.
---
apiVersion: v1
kind: Namespace
metadata:
  name: mariadb-operator
  labels:
    pad.io/zone: prod
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
---
# Base commune : tout endpoint du namespace est sélectionné (=> default-deny en entrée ET en sortie),
# puis on autorise : trafic intra-namespace, DNS (kube-dns), API Kubernetes, scrape depuis observability.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-baseline
  namespace: mariadb-operator
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mariadb-operator
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability # contracts: namespaces.monitoring_agents
    # Appels de l'API server (webhook de validation/conversion de mariadb-operator) : sans cette règle, la default-deny fait échouer toute admission
    # (« failed calling webhook ... context deadline exceeded »).
    - fromEntities: [kube-apiserver, remote-node, host]
      toPorts:
        - ports:
            - { port: "9443", protocol: TCP }
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mariadb-operator
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: ANY }
          rules:
            dns:
              - matchPattern: "*"
    - toEntities: [kube-apiserver]
    # L'opérateur se connecte aux bases qu'il gère (création de l'utilisateur, de la base et des droits, sauvegardes) :
    # sans cette sortie, User/Database restaient en « dial tcp ...:3306: i/o timeout » et CTFd en « Access denied ».
    # L'entrée est autorisée côté ctfd (NetworkPolicy mariadb-ingress de gitops/apps/ctfd).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ctfd # contracts: namespaces.ctfd
      toPorts:
        - ports:
            - { port: "3306", protocol: TCP }
