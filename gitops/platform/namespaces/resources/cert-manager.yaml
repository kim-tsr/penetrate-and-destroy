# Namespace cert-manager : PSS restricted, NetworkPolicy Cilium default-deny + autorisations minimales.
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    pad.io/zone: prod
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
---
# Base commune : tout endpoint du namespace est sélectionné (=> default-deny en entrée ET en sortie),
# puis on autorise : trafic intra-namespace, DNS (kube-dns), API Kubernetes, scrape depuis observability.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-baseline
  namespace: cert-manager
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cert-manager
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability # contracts: namespaces.monitoring_agents
    # Appels de l'API server (webhook cert-manager (10250) et API agrégée du webhook OVH v1alpha1.acme.pad.io (8443)) : sans cette règle, la default-deny fait échouer toute admission
    # (« failed calling webhook ... context deadline exceeded »).
    - fromEntities: [kube-apiserver, remote-node, host]
      toPorts:
        - ports:
            - { port: "10250", protocol: TCP }
            - { port: "8443", protocol: TCP }
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cert-manager
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: ANY }
          rules:
            dns:
              - matchPattern: "*"
    - toEntities: [kube-apiserver]
