# Exemple NON chiffré (valeurs CHANGEME) : `task secrets:init` le chiffre vers ovh-credentials.sops.yaml
# (règle gitops/.*\.sops\.yaml du .sops.yaml : seuls data/stringData sont chiffrés).
# Les valeurs viennent de secrets/ovh.sops.yaml (application_key / application_secret / consumer_key) : à renseigner
# avec `sops gitops/platform/cert-manager/resources/ovh-credentials.sops.yaml`.
apiVersion: v1
kind: Secret
metadata:
  name: ovh-credentials
  namespace: cert-manager
type: Opaque
stringData:
  applicationKey: CHANGEME
  applicationSecret: CHANGEME
  applicationConsumerKey: CHANGEME
