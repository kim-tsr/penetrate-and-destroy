apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-state-metrics
  namespace: argocd
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: platform
    pad.io/zone: prod
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-state-metrics
      targetRevision: 8.6.0
      helm:
        releaseName: kube-state-metrics
        valueFiles:
          - $values/gitops/platform/kube-state-metrics/values.yaml
    - repoURL: git@github.com:kim-tsr/penetrate-and-destroy.git # contracts: git.ssh
      targetRevision: main # contracts: git.branch
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability # contracts: namespaces.monitoring_agents
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
