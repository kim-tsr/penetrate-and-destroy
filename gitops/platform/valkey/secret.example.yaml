# Exemple non chiffré : le vrai Secret est secret.sops.yaml (SOPS + age, déchiffré par ksops ; créé par `task secrets:init`).
# Ne jamais commiter de valeur réelle en clair (docs/SECRETS.md).
# Namespace storage ; clé "default" = mot de passe de l'utilisateur ACL "default" (consommé par CTFd via REDIS_URL).
# `task secrets:init` recopie la même valeur dans REDIS_PASSWORD de gitops/apps/ctfd/secret.sops.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: valkey-auth
  namespace: storage # contracts: namespaces.storage
  annotations:
    argocd.argoproj.io/sync-wave: "-8" # après les namespaces (-10), avant valkey (-2)
type: Opaque
stringData:
  default: CHANGEME
