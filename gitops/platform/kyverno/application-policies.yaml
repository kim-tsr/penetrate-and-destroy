# Application ArgoCD : politiques Kyverno (ClusterPolicy). Wave -4 : après le moteur (-6), avant les apps.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
  labels:
    app.kubernetes.io/name: kyverno-policies
    app.kubernetes.io/part-of: pad-platform
    pad.io/zone: prod
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: platform
  source:
    repoURL: ssh://git@ssh.github.com:443/kim-tsr/penetrate-and-destroy.git # contracts: git.ssh
    targetRevision: main # contracts: git.branch
    path: gitops/platform/kyverno/policies
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true # CRDs ClusterPolicy créées par l'Application kyverno
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
  # spec.rules est atomique : les valeurs par défaut du CRD Kyverno (skipBackgroundRequests, allowExistingViolations,
  # useCache, signatureAlgorithm) y apparaissent côté live et rendaient toutes les ClusterPolicy OutOfSync.
  ignoreDifferences:
    - group: kyverno.io
      kind: ClusterPolicy
      jqPathExpressions:
        - .spec.rules[]?.skipBackgroundRequests
        - .spec.rules[]?.validate?.allowExistingViolations
        - .spec.rules[]?.verifyImages[]?.useCache
        - .spec.rules[]?.verifyImages[]?.attestors[]?.entries[]?.signatureAlgorithm
        - .spec.rules[]?.verifyImages[]?.attestors[]?.entries[]?.keys?.signatureAlgorithm
