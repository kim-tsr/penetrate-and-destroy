# kyverno chart 3.9.1 (app v1.19.1). Budget RAM serré : platform pool uniquement (2 workers de 3,5 Go).
# Le webhook d'admission est fail-closed (failurePolicy Fail) sur les namespaces ciblés par les politiques : une panne
# du contrôleur d'admission bloque la création de pods. Le contrôleur d'admission tourne donc en 2 réplicas, un par worker
# (anti-affinité préférée sur le nom d'hôte), avec un PodDisruptionBudget minAvailable 1 : un drain ou la perte d'un worker
# ne coupe plus l'admission. Compromis assumé : 2 et non 3 réplicas, car sur 2 workers un 3e réplica ne tolère pas plus de
# pannes de nœud et coûte 160 Mi de requests (320 Mi de limite) sur des nœuds déjà serrés ; passer à 3 si le pool platform
# passe à 3 workers ou plus. Les contrôleurs background et reports restent à 1 réplica (pas sur le chemin d'admission).
# Les namespaces kyverno / kube-system sont exclus par défaut des webhooks.
global:
  nodeSelector:
    kubernetes.io/os: linux
    pad.io/pool: platform

crds:
  install: true

# Pre-delete hook de nettoyage des webhooks : conservé (évite un cluster bloqué à la désinstallation).
webhooksCleanup:
  enabled: true

# Métriques (Service *-metrics, port 8000) : un ServiceMonitor par contrôleur, lus par Alloy
# (CRDs : Application prometheus-crds, wave -10). kyverno_policy_results_total vient des contrôleurs
# d'admission (requêtes) et background (scans).
admissionController:
  replicas: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # Un réplica par worker quand c'est possible (préféré, pas imposé : une mise à jour progressive ou un worker en moins
  # ne doit pas laisser un pod Pending et bloquer l'admission).
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: admission-controller
              app.kubernetes.io/instance: kyverno
  container:
    resources:
      requests: { cpu: 100m, memory: 160Mi }
      limits: { memory: 320Mi }
  initContainer:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 64Mi }
  serviceMonitor:
    enabled: true
    interval: 30s

backgroundController:
  replicas: 1
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 192Mi }
  serviceMonitor:
    enabled: true
    interval: 30s

reportsController:
  replicas: 1
  resources:
    requests: { cpu: 25m, memory: 96Mi }
    limits: { memory: 256Mi }
  serviceMonitor:
    enabled: true
    interval: 30s

# Désactivé (économie de RAM) : pas de CleanupPolicy utilisée dans la plateforme.
cleanupController:
  enabled: false
