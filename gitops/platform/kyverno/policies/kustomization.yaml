apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kyverno # ConfigMap cosign ; les ClusterPolicy / ClusterRole sont cluster-scoped

labels:
  - pairs:
      app.kubernetes.io/part-of: pad-platform
      app.kubernetes.io/managed-by: argocd
      pad.io/zone: prod
    includeSelectors: false

resources:
  - image-policy-configmap.yaml
  - rbac-background-controller.yaml
  - pss-restricted.yaml
  - require-requests-limits.yaml
  - disallow-latest-tag.yaml
  - verify-images.yaml
  - restrict-instance-images.yaml
  - add-default-networkpolicy.yaml
  - instance-guardrails.yaml
  - pdb-unhealthy-eviction.yaml
