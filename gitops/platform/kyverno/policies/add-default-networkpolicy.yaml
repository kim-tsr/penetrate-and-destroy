# À la création d'un namespace inst-*, génère un default-deny (entrée + sortie) et l'autorisation DNS.
# Les ouvertures d'entrée (NetBird / LB) sont ajoutées par le scénario d'instance de chall-manager.
# contracts: namespaces.instances_prefix
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-default-networkpolicy
  annotations:
    policies.kyverno.io/title: NetworkPolicy par défaut des instances
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/severity: high
spec:
  background: false
  rules:
    - name: default-deny
      match:
        any:
          - resources:
              kinds: ["Namespace"]
              names: ["inst-*"]
      generate:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: default-deny
        namespace: "{{request.object.metadata.name}}"
        synchronize: true
        data:
          spec:
            podSelector: {}
            policyTypes: ["Ingress", "Egress"]
    - name: allow-dns-egress
      match:
        any:
          - resources:
              kinds: ["Namespace"]
              names: ["inst-*"]
      generate:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: allow-dns-egress
        namespace: "{{request.object.metadata.name}}"
        synchronize: true
        data:
          spec:
            podSelector: {}
            policyTypes: ["Egress"]
            egress:
              - to:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: kube-system
                    podSelector:
                      matchLabels:
                        k8s-app: kube-dns
                ports:
                  - { port: 53, protocol: UDP }
                  - { port: 53, protocol: TCP }
