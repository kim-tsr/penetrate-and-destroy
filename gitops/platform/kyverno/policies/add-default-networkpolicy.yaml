# À la création d'un namespace inst-*, génère un default-deny (entrée + sortie), sans aucune ouverture.
# Pas d'autorisation DNS par défaut : un egress DNS vers CoreDNS permettrait un tunnel vers Internet. Le DNS limité à
# cluster.local est un opt-in (label pad.io/dns, voir instance-guardrails.yaml).
# Les ouvertures d'entrée (NetBird / LB) sont ajoutées par le scénario d'instance de chall-manager
# (NetworkPolicy `pad-instance`, nom distinct de `default-deny`).
# contracts: namespaces.instances_prefix
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-default-networkpolicy
  annotations:
    policies.kyverno.io/title: NetworkPolicy par défaut des instances
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/severity: high
spec:
  background: false
  rules:
    - name: default-deny
      match:
        any:
          - resources:
              kinds: ["Namespace"]
              names: ["inst-*"]
      generate:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: default-deny
        namespace: "{{request.object.metadata.name}}"
        synchronize: true
        data:
          spec:
            podSelector: {}
            policyTypes: ["Ingress", "Egress"]
