# Exemple non chiffré : le vrai Secret est secret-oidc.sops.yaml (SOPS + age, ksops ; créé par `task secrets:init`).
# Ne jamais commiter de valeur réelle en clair (docs/SECRETS.md).
# clientSecret : secret du client OIDC identity.oidc_clients.argocd (`pad-argocd`), généré par tofu 30-authentik
# (random_password, sortie sensible `oidc_client_secrets`). Reste à CHANGEME jusqu'à `task secrets:oidc-sync`
# (`sopsctl.py oidc-sync`, lancé par `task up` entre 30-authentik et bootstrap:gitops).
# Référencé par `configs.cm.oidc.config` (clientSecret: $argocd-oidc:clientSecret) de values.yaml : ArgoCD n'exige que le
# label app.kubernetes.io/part-of: argocd pour lire ce Secret. Appliqué par l'Application `root` (pas par le chart argo-cd).
apiVersion: v1
kind: Secret
metadata:
  name: argocd-oidc
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-8" # avant l'Application argocd (-5)
type: Opaque
stringData:
  clientSecret: CHANGEME
