# Exemple non chiffré : le vrai Secret est secret-s3.sops.yaml (SOPS + age, ksops ; créé par `task secrets:init`).
# Ne jamais commiter de valeur réelle en clair (docs/SECRETS.md).
# Clé S3 unique, au format Garage : access_key_id = "GK" + 24 hex, secret_access_key = 64 hex. Générée une seule fois par
# `task secrets:init` et recopiée à l'identique dans gitops/apps/ctfd/secret.sops.yaml (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY).
# Le Job garage-init l'importe dans Garage (`garage key import`) ; lue aussi par scripts/backup.sh et scripts/restore.sh.
apiVersion: v1
kind: Secret
metadata:
  name: garage-s3-credentials
  namespace: storage # contracts: namespaces.storage
  annotations:
    argocd.argoproj.io/sync-wave: "-8" # après les namespaces (-10), avant garage (-2)
type: Opaque
stringData:
  access_key_id: CHANGEME
  secret_access_key: CHANGEME
  # OPTIONNEL : clé dédiée aux sauvegardes (même format). Si présente, seule elle accède au bucket `backups` et la clé
  # de CTFd (ci-dessus) n'y a plus aucun droit. Ne l'activer qu'une fois scripts/backup.sh et scripts/restore.sh
  # basculés sur cette clé (sinon les sauvegardes échouent en 403). Retirer ces deux lignes pour rester en clé unique.
  # backup_access_key_id: CHANGEME
  # backup_secret_access_key: CHANGEME
