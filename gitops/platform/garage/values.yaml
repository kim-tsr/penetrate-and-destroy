# Garage v2.4.1 : un seul nœud, replication_factor 1, stockage sur la StorageClass ZFS.
# Service S3 : garage.storage.svc.cluster.local:3900 (contracts: apps.garage.s3_endpoint, region "garage").
# Layout, buckets et clé d'accès : Job PostSync manifests/job-init.yaml.
commonLabels:
  app.kubernetes.io/part-of: platform
  pad.io/zone: prod

garage:
  dbEngine: lmdb
  replicationFactor: "1" # un seul nœud : pas de redondance (les sauvegardes `backups` sont à exporter ailleurs)
  consistencyMode: consistent
  # Secret contenant la clé `rpcSecret` (64 hex) : voir secret-rpc.example.yaml.
  # Obligatoire : le secret auto-généré du chart utilise `lookup`, indisponible sous ArgoCD (régénéré à chaque rendu).
  existingRpcSecret: garage-rpc-secret
  s3:
    api:
      region: garage # contracts: apps.garage.region
      rootDomain: .s3.garage.pad.internal # contracts: internal_domain (accès path-style utilisé par les apps)
    web:
      rootDomain: .web.garage.pad.internal # contracts: internal_domain

persistence:
  enabled: true
  meta:
    storageClass: pad-zfs
    size: 2Gi
  data:
    storageClass: pad-zfs
    size: 20Gi # capacité déclarée dans le layout : 18GB (voir le Job)

deployment:
  kind: StatefulSet
  replicaCount: 1

image:
  repository: dxflrs/amd64_garage # cluster Talos x86_64 uniquement
  tag: v2.4.1@sha256:0d7c74fc8ca6fef68a5a941c0e7558c8b1e92ba3588fa7505400e1350456c796

initImage:
  repository: busybox
  tag: 1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: true

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: 500m, memory: 384Mi }

# /health répond 200 seulement quand le quorum existe (donc après le layout) : sondes TCP sur l'API admin,
# sinon le pod ne serait jamais Ready et le Job d'initialisation ne pourrait pas démarrer.
livenessProbe:
  tcpSocket:
    port: 3903
  initialDelaySeconds: 10
  periodSeconds: 30
readinessProbe:
  tcpSocket:
    port: 3903
  initialDelaySeconds: 5
  periodSeconds: 10

monitoring:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
