# ServiceAccount du Job garage-init : exécuter la CLI garage dans le pod garage-0 (aucun accès aux Secrets : la clé S3 est injectée par secretKeyRef).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: garage-init
  namespace: storage
  labels:
    app.kubernetes.io/name: garage-init
    app.kubernetes.io/part-of: platform
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: garage-init
  namespace: storage
  labels:
    app.kubernetes.io/name: garage-init
    app.kubernetes.io/part-of: platform
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/exec]
    resourceNames: [garage-0]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: garage-init
  namespace: storage
  labels:
    app.kubernetes.io/name: garage-init
    app.kubernetes.io/part-of: platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: garage-init
subjects:
  - kind: ServiceAccount
    name: garage-init
    namespace: storage
