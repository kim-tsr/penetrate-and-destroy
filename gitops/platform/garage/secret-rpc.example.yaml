# Exemple non chiffré : le vrai Secret est secret-rpc.sops.yaml (SOPS + age, ksops ; créé par `task secrets:init`).
# Ne jamais commiter de valeur réelle en clair (docs/SECRETS.md).
# rpcSecret : 64 caractères hexadécimaux (`openssl rand -hex 32`), généré par `task secrets:init`.
# La clé S3 (Secret garage-s3-credentials) est dans secret-s3.example.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: garage-rpc-secret
  namespace: storage # contracts: namespaces.storage
  annotations:
    argocd.argoproj.io/sync-wave: "-8" # après les namespaces (-10), avant garage (-2)
type: Opaque
stringData:
  rpcSecret: CHANGEME
