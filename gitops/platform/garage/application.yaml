# Garage v2.4.1 (S3) : chart Helm upstream lu directement dans le dépôt Git Deuxfleurs au tag v2.4.1
# (script/helm/garage, chart 0.10.2), + manifests locaux (RBAC + Job d'initialisation PostSync).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: garage
  namespace: argocd
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/part-of: platform
    pad.io/zone: prod
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: https://git.deuxfleurs.fr/Deuxfleurs/garage.git
      targetRevision: v2.4.1
      path: script/helm/garage
      helm:
        releaseName: garage
        valueFiles:
          - $values/gitops/platform/garage/values.yaml
    - repoURL: ssh://git@ssh.github.com:443/kim-tsr/penetrate-and-destroy.git # contracts: git.ssh
      targetRevision: main # contracts: git.branch
      ref: values
    - repoURL: ssh://git@ssh.github.com:443/kim-tsr/penetrate-and-destroy.git # contracts: git.ssh
      targetRevision: main # contracts: git.branch
      path: gitops/platform/garage/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: storage # contracts: namespaces.storage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
  # volumeClaimTemplates est une liste atomique (possédée en bloc par ArgoCD) : l'API server y ajoute apiVersion, kind,
  # volumeMode et status, non paramétrables dans le chart -> OutOfSync permanent sans ces exclusions.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.volumeClaimTemplates[]?.apiVersion
        - .spec.volumeClaimTemplates[]?.kind
        - .spec.volumeClaimTemplates[]?.spec.volumeMode
        - .spec.volumeClaimTemplates[]?.status
