apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mariadb-operator
  namespace: argocd
  labels:
    app.kubernetes.io/name: mariadb-operator
    app.kubernetes.io/part-of: platform
    pad.io/zone: prod
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: https://helm.mariadb.com/mariadb-operator
      chart: mariadb-operator
      targetRevision: 26.10.1
      helm:
        releaseName: mariadb-operator
        valueFiles:
          - $values/gitops/platform/mariadb-operator/values.yaml
    - repoURL: https://github.com/kim-tsr/penetrate-and-destroy.git # contracts: git.repo
      targetRevision: main # contracts: git.branch
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: mariadb-operator # créé par gitops/platform/namespaces
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
