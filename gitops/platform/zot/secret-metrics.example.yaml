# Exemple non chiffré : le vrai Secret est secret-metrics.sops.yaml (SOPS + age, ksops ; créé par `task secrets:init`).
# Identifiants en clair de l'utilisateur "metrics" pour le PodMonitor : même mot de passe que sa ligne de
# secret.sops.yaml (htpasswd), `task secrets:init` génère les deux ensemble.
apiVersion: v1
kind: Secret
metadata:
  name: zot-metrics-basic-auth
  namespace: registry # contracts: namespaces.registry
  annotations:
    argocd.argoproj.io/sync-wave: "-8" # après les namespaces (-10), avant zot (-2)
type: Opaque
stringData:
  username: metrics
  password: CHANGEME
