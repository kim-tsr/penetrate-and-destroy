# Générateur ksops : déchiffre secret.sops.yaml et secret-metrics.sops.yaml (SOPS + age, créés par `task secrets:init`)
# avec la clé age du cluster (Secret sops-age du namespace argocd). Voir docs/SECRETS.md.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: zot-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - secret.sops.yaml
  - secret-metrics.sops.yaml
