# Exemple non chiffré : le vrai Secret est secret.sops.yaml (SOPS + age, ksops ; créé par `task secrets:init`).
# Ne jamais commiter de valeur réelle en clair (docs/SECRETS.md).
# htpasswd : une ligne par utilisateur, hash bcrypt (`htpasswd -nbB <user> <mot_de_passe>`), généré par `task secrets:init`.
#   admin    : administration complète
#   pad-ci   : push/pull du CI (pad/**)
#   pad-pull : pull seul (imagePullSecret des nœuds)
#   metrics  : lecture de /metrics (Alloy, via zot-metrics-basic-auth : secret-metrics.example.yaml)
# Les mots de passe en clair d'admin, pad-ci et pad-pull sont conservés chiffrés dans secrets/credentials.sops.yaml
# (réservé à l'opérateur) : `sops -d --extract '["zot_pad_ci_password"]' secrets/credentials.sops.yaml`.
apiVersion: v1
kind: Secret
metadata:
  name: zot-htpasswd
  namespace: registry # contracts: namespaces.registry
  annotations:
    argocd.argoproj.io/sync-wave: "-8" # après les namespaces (-10), avant zot (-2)
type: Opaque
stringData:
  htpasswd: |
    admin:CHANGEME
    pad-ci:CHANGEME
    pad-pull:CHANGEME
    metrics:CHANGEME
