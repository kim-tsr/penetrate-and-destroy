apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-exporter
  namespace: argocd
  labels:
    app.kubernetes.io/name: node-exporter
    app.kubernetes.io/part-of: platform
    pad.io/zone: prod
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus-node-exporter
      targetRevision: 4.60.0
      helm:
        releaseName: node-exporter
        valueFiles:
          - $values/gitops/platform/node-exporter/values.yaml
    - repoURL: https://github.com/kim-tsr/penetrate-and-destroy.git # contracts: git.repo
      targetRevision: main # contracts: git.branch
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability # contracts: namespaces.monitoring_agents (PSS privileged : hostNetwork/hostPID)
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
