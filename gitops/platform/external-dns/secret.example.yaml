# EXEMPLE non chiffré (valeurs CHANGEME). Version réelle : secret.sops.yaml, chiffré SOPS/age et déchiffré par ksops
# (secret-generator.yaml). Créé par `task secrets:init` ; à renseigner ensuite : mêmes valeurs OVH que secrets/ovh.sops.yaml.
# Ne jamais commiter de valeur réelle en clair (docs/SECRETS.md).
apiVersion: v1
kind: Secret
metadata:
  name: external-dns-ovh
  namespace: external-dns
  labels:
    app.kubernetes.io/name: external-dns
    app.kubernetes.io/part-of: pad-platform
    pad.io/zone: prod
  annotations:
    argocd.argoproj.io/sync-wave: "-8" # après les namespaces (-10), avant les composants (-5 et au-delà)
type: Opaque
stringData:
  application_key: CHANGEME
  application_secret: CHANGEME
  consumer_key: CHANGEME
