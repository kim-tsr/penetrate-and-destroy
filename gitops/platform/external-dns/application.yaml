# Application ArgoCD : external-dns (provider OVH). DÉSACTIVÉ par défaut (replicaCount: 0), voir README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  labels:
    app.kubernetes.io/name: external-dns
    app.kubernetes.io/part-of: pad-platform
    pad.io/zone: prod
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: platform
  sources:
    - repoURL: https://kubernetes-sigs.github.io/external-dns/
      chart: external-dns
      targetRevision: 1.23.0
      helm:
        releaseName: external-dns
        valueFiles:
          - $values/gitops/platform/external-dns/values.yaml
    - repoURL: https://github.com/kim-tsr/penetrate-and-destroy.git # contracts: git.repo
      targetRevision: main # contracts: git.branch
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
