apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Application ArgoCD (namespace argocd). values.yaml est lu par ArgoCD via `$values`.
# Le Secret OVH est déchiffré par ksops depuis secret.sops.yaml (créé par `task secrets:init`, cf. docs/SECRETS.md) ;
# secret.example.yaml n'est jamais appliqué.
resources:
  - application.yaml
generators:
  - secret-generator.yaml
