# NetworkPolicy Cilium des namespaces des providers Cluster API : ils portent des identifiants sensibles
# (jeton de l'API Proxmox dans capmox-system, accès aux machine configs / CA Talos), sans filtrage jusqu'ici.
# Base commune par namespace : tout endpoint est sélectionné (=> default-deny en entrée ET en sortie), puis on autorise :
# trafic intra-namespace, DNS (kube-dns), API Kubernetes, scrape depuis observability, webhooks depuis l'API server,
# et les seuls flux sortants propres au provider (API Proxmox pour CAPMOX, apid des nœuds CP pour CACPPT).
# Les Namespace eux-mêmes (et leurs labels PSS, cf. kustomization.yaml) viennent du rendu clusterctl.
# Source des IP : infra/contracts.yaml.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-baseline
  namespace: capi-system
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: capi-system
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability # contracts: namespaces.monitoring_agents
    # Webhooks d'admission et de conversion appelés par l'API server.
    - fromEntities: [kube-apiserver, remote-node, host]
      toPorts:
        - ports:
            - { port: "9443", protocol: TCP }
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: capi-system
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: ANY }
          rules:
            dns:
              - matchPattern: "*"
    - toEntities: [kube-apiserver]
    # API Kubernetes via la VIP du control plane (kubeconfig du cluster géré, auto-hébergé).
    - toCIDR: ["10.20.60.5/32"] # contracts: kubernetes.control_plane_endpoint
      toPorts:
        - ports:
            - { port: "6443", protocol: TCP } # contracts: flow_ports.kube_api
---
