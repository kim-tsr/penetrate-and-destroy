# Générateur ksops : déchiffre secret.sops.yaml (SOPS + age, créé par `task secrets:init`) avec la clé age du cluster
# (Secret sops-age du namespace argocd). Voir docs/SECRETS.md.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: proxmox-csi-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - secret.sops.yaml
