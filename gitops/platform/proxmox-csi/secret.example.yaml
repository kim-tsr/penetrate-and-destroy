# EXEMPLE non chiffré (valeurs CHANGEME). Ne jamais commiter la version avec de vraies valeurs en clair.
# Version réelle : secret.sops.yaml chiffré (cf. README.md), déchiffré par ksops (secret-generator.yaml) ; créé par
# `task secrets:init`, puis à compléter (token_secret vient de Proxmox).
# Utilisateur Proxmox dédié (rôle CSI : Datastore.Allocate, Datastore.AllocateSpace, Datastore.Audit,
# VM.Audit, VM.Config.Disk, Sys.Audit) + API token.
# Secret partagé avec le cloud controller manager (gitops/platform/proxmox-ccm, même namespace) : un seul jeton.
apiVersion: v1
kind: Secret
metadata:
  name: proxmox-csi-config
  namespace: csi-proxmox
  labels:
    app.kubernetes.io/name: proxmox-csi-plugin
    app.kubernetes.io/part-of: pad-platform
    pad.io/zone: prod
  annotations:
    argocd.argoproj.io/sync-wave: "-8" # après les namespaces (-10), avant le CSI (-5)
type: Opaque
stringData:
  config.yaml: |
    features:
      # capmox : providerID `proxmox://<SMBIOS UUID>` (format de CAPMOX), posé par le CCM et compris par le CSI.
      provider: capmox
    clusters:
      - url: https://10.20.10.2:8006/api2/json # contracts: host.mgmt_ip
        insecure: true # passer à false une fois le certificat Proxmox de confiance
        token_id: "csi@pve!csi" # utilisateur Proxmox dédié (adapter si le nom diffère)
        token_secret: "CHANGEME"
        region: pve # contracts: host.node
