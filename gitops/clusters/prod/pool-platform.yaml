# Pool "platform" : workers de la zone PROD (VLAN 60), taille fixe.
---
apiVersion: ipam.cluster.x-k8s.io/v1alpha2
kind: InClusterIPPool
metadata:
  name: pad-prod-platform
  annotations:
    ipam.capmox.cluster.x-k8s.io/gateway-metric: "100"
spec:
  addresses: [10.20.60.20-10.20.60.39] # contracts: kubernetes.pools.platform.ip_pool
  prefix: 24 # contracts: zones.prod.cidr
  gateway: 10.20.60.1 # contracts: zones.prod.gw
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ProxmoxMachineTemplate
metadata:
  name: pad-prod-platform
spec:
  template:
    spec:
      sourceNode: pve # contracts: host.node
      templateID: 299 # contracts: kubernetes.talos_template.vmid
      full: true
      format: raw
      storage: local-zfs # contracts: host.datastore_vm
      vmIDRange: { start: 300, end: 399 } # contracts: kubernetes.vmid_range
      numSockets: 1
      numCores: 2 # contracts: kubernetes.pools.platform.cores
      memoryMiB: 3584 # contracts: kubernetes.pools.platform.memory_mb
      disks:
        bootVolume: { disk: scsi0, sizeGb: 40 } # contracts: kubernetes.pools.platform.disk_gb
      tags: [pad, talos, pad-prod, platform]
      checks:
        skipCloudInitStatus: true
      metadataSettings:
        providerIDInjection: true
      network:
        networkDevices:
          - name: net0
            bridge: vmbr2 # contracts: host.zones_bridge
            vlan: 60 # contracts: zones.prod.vlan
            model: virtio
            defaultIPv4: false
            ipPoolRef:
              - apiGroup: ipam.cluster.x-k8s.io
                kind: InClusterIPPool
                name: pad-prod-platform
            dnsServers: [10.20.60.1] # contracts: zones.prod.gw
---
apiVersion: bootstrap.cluster.x-k8s.io/v1alpha3
kind: TalosConfigTemplate
metadata:
  name: pad-prod-platform
spec:
  template:
    spec:
      generateType: worker
      talosVersion: v1.11.3 # contracts: kubernetes.talos_version
      strategicPatches:
        - |
          machine:
            install:
              disk: /dev/sda
              image: factory.talos.dev/nocloud-installer/ce4c980550dd2ab1b17bbf2b08801c7eb59418eafe8f279833297925d67c7515:v1.11.3
            kubelet:
              extraArgs:
                rotate-server-certificates: "true"
                cloud-provider: external
              nodeIP:
                validSubnets: [10.20.60.0/24] # contracts: zones.prod.cidr
            nodeLabels:
              pad.io/pool: platform
              pad.io/zone: prod
            features:
              kubePrism: { enabled: true, port: 7445 }
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: pad-prod-platform
spec:
  clusterName: pad-prod
  replicas: 2 # contracts: kubernetes.pools.platform.replicas
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: pad-prod
      pad.io/pool: platform
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: pad-prod
        pad.io/pool: platform
    spec:
      clusterName: pad-prod
      version: v1.34.1 # contracts: kubernetes.kubernetes_version
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: TalosConfigTemplate
          name: pad-prod-platform
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: ProxmoxMachineTemplate
        name: pad-prod-platform
