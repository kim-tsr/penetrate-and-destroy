# Pool "challenges" : workers de la zone CHALLENGES (VLAN 70), autoscalés par cluster-autoscaler
# (provider clusterapi). Pas de `replicas` : l'autoscaler le pilote (ignoré par ArgoCD, cf. Application cluster-prod).
#
# Créé par ArgoCD (Application cluster-prod, phase 10), PAS par `task bootstrap:cluster` (annotation pad.io/bootstrap:
# gitops, filtrée par bootstrap/scripts/cluster.sh) : la zone n'a aucun egress Internet, ses nœuds tirent toutes leurs
# images (kubelet compris) du cache pull-through de Zot, qui n'existe qu'après la phase 10. Créé avant le pivot, le
# worker ne rejoindrait jamais le cluster et `clusterctl move` refuserait de pivoter (Machine sans nodeRef).
#
# Les templates sont IMMUABLES (webhooks CAPMOX/CABPT : « Spec is immutable ») : toute modification de leur spec passe
# par un NOUVEAU nom (suffixe -vN incrémenté) et la mise à jour de la référence dans le MachineDeployment, qui
# remplace alors les workers un par un (rolling update). L'ancien template reste (Prune=false) : le supprimer à la
# main une fois plus aucune Machine ne le référence (`kubectl -n pad-cluster get machines -o wide`).
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ProxmoxMachineTemplate
metadata:
  name: pad-prod-challenges
  annotations:
    pad.io/bootstrap: gitops # créé par ArgoCD après la phase 10 (voir en tête de fichier)
spec:
  template:
    spec:
      sourceNode: pve # contracts: host.node
      templateID: 299 # contracts: kubernetes.talos_template.vmid
      full: true
      format: raw
      storage: local-zfs # contracts: host.datastore_vm
      vmIDRange: { start: 300, end: 399 } # contracts: kubernetes.vmid_range
      numSockets: 1
      numCores: 2 # contracts: kubernetes.pools.challenges.cores
      memoryMiB: 2560 # contracts: kubernetes.pools.challenges.memory_mb
      disks:
        bootVolume: { disk: scsi0, sizeGb: 30 } # contracts: kubernetes.pools.challenges.disk_gb
      tags: [pad, talos, pad-prod, challenges]
      checks:
        skipCloudInitStatus: true
      metadataSettings:
        providerIDInjection: true
      network:
        # Zone CAPMOX du pool (ProxmoxCluster.spec.zoneConfig) : net0 reçoit UNE IP de kubernetes.pools.challenges.ip_pool,
        # passerelle et route par défaut de la zone. Pas d'ipPoolRef ici : les pools s'ajoutent (IP et route en double).
        zone: challenges # contracts: kubernetes.pools.challenges (nom du pool)
        networkDevices:
          - name: net0
            bridge: vmbr2 # contracts: host.zones_bridge
            vlan: 70 # contracts: zones.challenges.vlan
            model: virtio
            defaultIPv4: true # IP de la zone ci-dessus (CAPMOX force de toute façon true sur net0)
            # Obligatoire : CAPMOX v0.9.1 écrit les dnsServers du ProxmoxCluster (PROD), jamais ceux de zoneConfig.
            dnsServers: [10.20.70.1] # contracts: zones.challenges.gw
---
apiVersion: bootstrap.cluster.x-k8s.io/v1alpha3
kind: TalosConfigTemplate
metadata:
  # v2 : miroirs de registres vers Zot (v1, sans miroir, ne pouvait tirer aucune image).
  name: pad-prod-challenges-v2
  annotations:
    pad.io/bootstrap: gitops # créé par ArgoCD après la phase 10 (voir en tête de fichier)
spec:
  template:
    spec:
      generateType: worker
      talosVersion: v1.11.3 # contracts: kubernetes.talos_version
      strategicPatches:
        - |
          machine:
            install:
              disk: /dev/sda
              image: factory.talos.dev/nocloud-installer/ce4c980550dd2ab1b17bbf2b08801c7eb59418eafe8f279833297925d67c7515:v1.11.3
            # Pas d'egress Internet dans la zone CHALLENGES : heure prise sur OPNsense (passerelle de la zone, règle m10-chall-ntp).
            time:
              servers: [10.20.70.1] # contracts: zones.challenges.gw
            kubelet:
              extraArgs:
                rotate-server-certificates: "true"
                cloud-provider: external
              # Pool des instances de joueurs : bornes anti-déni de service et user namespaces.
              extraConfig:
                podPidsLimit: 256 # contracts: instances.pod_pids_limit (fork bomb)
                maxPods: 40 # contracts: instances.max_pods_per_node
                featureGates:
                  UserNamespacesSupport: true # pods hostUsers: false (K8s >= 1.33, beta activé par défaut)
              nodeIP:
                validSubnets: [10.20.70.0/24] # contracts: zones.challenges.cidr
            sysctls:
              user.max_user_namespaces: "11255" # nombre de user namespaces (pods hostUsers: false), cf. docs Talos
            # Pas d'egress Internet : TOUTES les images des nœuds (kubelet, pause, Cilium, CSI, Alloy, node-exporter...) passent
            # par le cache pull-through de Zot (extension sync, préfixe mirror/<registre>, liste blanche de dépôts dans
            # gitops/platform/zot/values.yaml). overridePath : l'endpoint est utilisé tel quel (pas de /v2 ajouté) ;
            # skipFallback : pas de tentative vers le registre public (injoignable, chaque essai attendrait un timeout).
            # Résolution : override Unbound registry.pad.internal -> ingress du cluster (stack 60-opnsense-rules) ;
            # flux : règle M10 « workers CHALLENGES -> ingress 443 ».
            registries:
              mirrors:
                docker.io:
                  endpoints: [https://registry.pad.internal/v2/mirror/docker.io] # contracts: apps.registry
                  overridePath: true
                  skipFallback: true
                ghcr.io:
                  endpoints: [https://registry.pad.internal/v2/mirror/ghcr.io] # contracts: apps.registry
                  overridePath: true
                  skipFallback: true
                quay.io:
                  endpoints: [https://registry.pad.internal/v2/mirror/quay.io] # contracts: apps.registry
                  overridePath: true
                  skipFallback: true
                registry.k8s.io:
                  endpoints: [https://registry.pad.internal/v2/mirror/registry.k8s.io] # contracts: apps.registry
                  overridePath: true
                  skipFallback: true
                factory.talos.dev: # installeur Talos (talosctl upgrade)
                  endpoints: [https://registry.pad.internal/v2/mirror/factory.talos.dev] # contracts: apps.registry
                  overridePath: true
                  skipFallback: true
              config:
                registry.pad.internal: # contracts: apps.registry
                  # Certificat émis par la CA interne pad-internal-ca, générée DANS le cluster en phase 10 : elle n'existe
                  # pas quand ce template (public, immuable) est écrit, d'où l'absence de `tls.ca`. Risque accepté : un
                  # attaquant placé sur le chemin VLAN 70 -> OPNsense -> VLAN 60 pourrait servir une image ; les miroirs sont
                  # anonymes (aucun identifiant exposé) et les images des DaemonSets sont épinglées par @sha256 (vérifié par
                  # containerd). Voir docs/composants/zot.md (« Miroir pull-through »).
                  tls:
                    insecureSkipVerify: true
            # Identifiants de pull de Zot pour ctf/** (compte pad-pull) : volontairement ABSENTS de ce template (le dépôt est
            # public et Cluster API ne déchiffre pas SOPS). Posés sur chaque nœud par `talosctl patch machineconfig`
            # (docs/operations/actions-post-deploiement.md, action 8).
            nodeLabels:
              pad.io/pool: challenges
              pad.io/zone: challenges
            # contracts: kubernetes.pools.challenges.taint (pad.io/pool=challenges:NoSchedule)
            nodeTaints:
              pad.io/pool: challenges:NoSchedule
            features:
              kubePrism: { enabled: true, port: 7445 }
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: pad-prod-challenges
  annotations:
    pad.io/bootstrap: gitops # créé par ArgoCD après la phase 10 (voir en tête de fichier)
    # contracts: kubernetes.pools.challenges.min / max
    cluster.x-k8s.io/cluster-api-autoscaler-node-group-min-size: "1"
    cluster.x-k8s.io/cluster-api-autoscaler-node-group-max-size: "3"
    # Gabarit pour la simulation (utile si min passe à 0) : ressources + taint du pool.
    capacity.cluster-autoscaler.kubernetes.io/cpu: "2"
    capacity.cluster-autoscaler.kubernetes.io/memory: "2560Mi"
    capacity.cluster-autoscaler.kubernetes.io/maxPods: "40" # contracts: instances.max_pods_per_node
    capacity.cluster-autoscaler.kubernetes.io/labels: "pad.io/pool=challenges,pad.io/zone=challenges"
    capacity.cluster-autoscaler.kubernetes.io/taints: "pad.io/pool=challenges:NoSchedule"
spec:
  clusterName: pad-prod
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: pad-prod
      pad.io/pool: challenges
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: pad-prod
        pad.io/pool: challenges
    spec:
      clusterName: pad-prod
      version: v1.34.1 # contracts: kubernetes.kubernetes_version
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: TalosConfigTemplate
          name: pad-prod-challenges-v2
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: ProxmoxMachineTemplate
        name: pad-prod-challenges
