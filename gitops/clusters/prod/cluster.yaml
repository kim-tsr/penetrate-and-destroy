---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: pad-prod # contracts: kubernetes.cluster_name
  annotations:
    # Garde-fous : ArgoCD ne supprime jamais le Cluster (sa suppression détruit toutes les VMs,
    # y compris celle qui héberge ArgoCD). La destruction passe par `task bootstrap:destroy`.
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  clusterNetwork:
    pods:
      cidrBlocks: [10.244.0.0/16] # contracts: kubernetes.pod_cidr
    services:
      cidrBlocks: [10.96.0.0/12] # contracts: kubernetes.service_cidr
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: TalosControlPlane
    name: pad-prod-cp
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: ProxmoxCluster
    name: pad-prod
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ProxmoxCluster
metadata:
  name: pad-prod
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  allowedNodes: [pve] # contracts: host.node
  controlPlaneEndpoint:
    host: 10.20.60.5 # contracts: kubernetes.control_plane_endpoint (VIP Talos)
    port: 6443
  # Résolveur : le .1 de la zone (Unbound OPNsense). contracts: zones.prod.gw / dns_resolver
  dnsServers: [10.20.60.1]
  # Zone CAPMOX "default" = IPs du control plane uniquement (ProxmoxMachine sans `network.zone`).
  # contracts: kubernetes.control_plane.ip_pool / zones.prod
  ipv4Config:
    addresses: [10.20.60.10-10.20.60.14]
    prefix: 24
    gateway: 10.20.60.1
    metric: 100
  # Une zone CAPMOX par pool de workers (sélectionnée par `network.zone` du ProxmoxMachineTemplate). Indispensable :
  # le webhook de CAPMOX force `defaultIPv4: true` sur net0 de TOUTE machine (même écrit `false`) ; sans zone dédiée,
  # un worker recevrait une IP du control plane EN PLUS de son pool, avec deux routes par défaut identiques
  # (« route already exists for destination/metric »). CAPMOX crée lui-même les InClusterIPPool
  # `pad-prod-<zone>-v4-icip`. Voir docs/composants/capmox.md (pièges connus).
  zoneConfig:
    - zone: platform # contracts: kubernetes.pools.platform (nom du pool)
      dnsServers: [10.20.60.1] # contracts: zones.prod.gw
      ipv4Config:
        addresses: [10.20.60.20-10.20.60.39] # contracts: kubernetes.pools.platform.ip_pool
        prefix: 24 # contracts: zones.prod.cidr
        gateway: 10.20.60.1 # contracts: zones.prod.gw
        metric: 100
    - zone: challenges # contracts: kubernetes.pools.challenges (nom du pool)
      dnsServers: [10.20.70.1] # contracts: zones.challenges.gw
      ipv4Config:
        addresses: [10.20.70.20-10.20.70.39] # contracts: kubernetes.pools.challenges.ip_pool
        prefix: 24 # contracts: zones.challenges.cidr
        gateway: 10.20.70.1 # contracts: zones.challenges.gw
        metric: 100
