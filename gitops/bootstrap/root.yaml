# Racine GitOps (app-of-apps) : appliquée une seule fois par `task bootstrap:gitops`, puis auto-gérée.
# - AppProjects : platform (socle), apps (applicatif CTF), cluster (objets Cluster API).
# - Application `root` : synchronise gitops/platform (kustomization listant les Applications du socle).
# - ApplicationSet `apps` (sync-wave 10) : une Application par dossier gitops/apps/*.
# Toutes les valeurs viennent de infra/contracts.yaml (commentaires `# contracts:`).
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: pad-gitops
spec:
  description: Socle de la plateforme (CNI, cert-manager, ingress, ArgoCD, opérateurs, observabilité)
  sourceRepos:
    - ssh://git@ssh.github.com:443/kim-tsr/penetrate-and-destroy.git # contracts: git.ssh
    # Registres de charts Helm autorisés (à compléter à chaque nouveau chart du socle).
    - https://helm.cilium.io
    - https://charts.jetstack.io
    - https://aureq.github.io/cert-manager-webhook-ovh
    - https://traefik.github.io/charts
    - https://argoproj.github.io/argo-helm
    - https://prometheus-community.github.io/helm-charts
    - https://kyverno.github.io/kyverno/
    - https://kedacore.github.io/charts
    - https://kubernetes.github.io/autoscaler
    - https://kubernetes-sigs.github.io/external-dns/
    - https://helm.mariadb.com/mariadb-operator
    - https://valkey.io/valkey-helm/
    - https://zotregistry.dev/helm-charts
    - https://grafana.github.io/helm-charts
    - https://git.deuxfleurs.fr/Deuxfleurs/garage.git
    - ghcr.io/sergelogvinov/charts
  destinations:
    - { server: https://kubernetes.default.svc, namespace: kube-system }
    - { server: https://kubernetes.default.svc, namespace: argocd }
    - { server: https://kubernetes.default.svc, namespace: cert-manager }
    - { server: https://kubernetes.default.svc, namespace: traefik }
    - { server: https://kubernetes.default.svc, namespace: cluster-autoscaler }
    - { server: https://kubernetes.default.svc, namespace: csi-proxmox }
    - { server: https://kubernetes.default.svc, namespace: external-dns }
    - { server: https://kubernetes.default.svc, namespace: keda }
    - { server: https://kubernetes.default.svc, namespace: kyverno }
    - { server: https://kubernetes.default.svc, namespace: mariadb-operator }
    - { server: https://kubernetes.default.svc, namespace: observability } # contracts: namespaces.monitoring_agents
    - { server: https://kubernetes.default.svc, namespace: registry } # contracts: namespaces.registry
    - { server: https://kubernetes.default.svc, namespace: storage } # contracts: namespaces.storage
    # Providers Cluster API (gitops/platform/capi-providers)
    - { server: https://kubernetes.default.svc, namespace: capi-system }
    - { server: https://kubernetes.default.svc, namespace: cabpt-system }
    - { server: https://kubernetes.default.svc, namespace: cacppt-system }
    - { server: https://kubernetes.default.svc, namespace: capmox-system }
    - { server: https://kubernetes.default.svc, namespace: capi-ipam-in-cluster-system }
  # Le socle porte des CRDs, Namespaces, ClusterRoles, webhooks, etc.
  clusterResourceWhitelist:
    - { group: "*", kind: "*" }
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: pad-gitops
spec:
  description: Applications CTF (ctfd, frontend, chall-manager, netbird-sync)
  sourceRepos:
    - ssh://git@ssh.github.com:443/kim-tsr/penetrate-and-destroy.git # contracts: git.ssh
  destinations:
    - { server: https://kubernetes.default.svc, namespace: ctfd } # contracts: namespaces.ctfd
    - { server: https://kubernetes.default.svc, namespace: frontend } # contracts: namespaces.frontend
    - { server: https://kubernetes.default.svc, namespace: chall-manager } # contracts: namespaces.chall_manager
    - { server: https://kubernetes.default.svc, namespace: netbird-sync } # contracts: namespaces.netbird_sync
  # Uniquement les ressources cluster-scoped que les apps doivent porter :
  #  - leur Namespace (gitops/apps/*/namespace.yaml, Delete=false) ;
  #  - le RBAC cluster de chall-manager et de netbird-sync (ClusterRole + ClusterRoleBinding) ;
  #  - leurs garde-fous d'admission (ValidatingAdmissionPolicy + Binding : écritures limitées aux namespaces inst-*,
  #    cf. gitops/apps/{chall-manager,netbird-sync}/rbac.yaml). Sans eux la synchronisation d'Application serait refusée.
  # LIMITE CONNUE : un AppProject filtre par groupe/kind, jamais par nom. Toute PR dans gitops/apps/** pourrait donc
  # déclarer un ClusterRoleBinding vers cluster-admin. Compensations : CODEOWNERS sur gitops/ et bootstrap/ + protection
  # de la branche main (revue obligatoire, cf. docs/operations/protection-branche.md) ; ne jamais ajouter d'autres kinds
  # ici ; revue systématique de tout diff touchant rbac.yaml.
  clusterResourceWhitelist:
    - { group: "", kind: Namespace }
    - { group: rbac.authorization.k8s.io, kind: ClusterRole }
    - { group: rbac.authorization.k8s.io, kind: ClusterRoleBinding }
    - { group: admissionregistration.k8s.io, kind: ValidatingAdmissionPolicy }
    - { group: admissionregistration.k8s.io, kind: ValidatingAdmissionPolicyBinding }
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cluster
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: pad-gitops
spec:
  description: Objets Cluster API du cluster pad-prod (auto-hébergé)
  sourceRepos:
    - ssh://git@ssh.github.com:443/kim-tsr/penetrate-and-destroy.git # contracts: git.ssh
  destinations:
    - { server: https://kubernetes.default.svc, namespace: pad-cluster } # contracts: kubernetes.capi_namespace
  clusterResourceWhitelist:
    - { group: "", kind: Namespace }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: pad-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: ssh://git@ssh.github.com:443/kim-tsr/penetrate-and-destroy.git # contracts: git.ssh
    targetRevision: main # contracts: git.branch
    path: gitops/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 10
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: pad-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: ssh://git@ssh.github.com:443/kim-tsr/penetrate-and-destroy.git # contracts: git.ssh
        revision: main # contracts: git.branch
        directories:
          - path: gitops/apps/*
  template:
    metadata:
      name: "{{ .path.basename }}"
      labels:
        app.kubernetes.io/part-of: pad-apps
      annotations:
        argocd.argoproj.io/sync-wave: "10"
    spec:
      project: apps
      source:
        repoURL: ssh://git@ssh.github.com:443/kim-tsr/penetrate-and-destroy.git # contracts: git.ssh
        targetRevision: main # contracts: git.branch
        path: "{{ .path.path }}"
      destination:
        server: https://kubernetes.default.svc
        # Convention : le dossier porte le nom du namespace (contracts: namespaces.*), créé par le namespace.yaml de l'app
        # (le Namespace est autorisé dans le projet `apps`).
        namespace: "{{ .path.basename }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
        retry:
          limit: 10
          backoff: { duration: 15s, factor: 2, maxDuration: 5m }
