# Configuration clusterctl du bootstrap : providers référencés par URL de release explicite
# (les versions effectives viennent de infra/contracts.yaml -> kubernetes.capi.*).
# Aucun secret ici : les identifiants Proxmox sont passés en variables d'environnement
# (PROXMOX_URL/TOKEN/SECRET) déchiffrées depuis secrets/proxmox.sops.yaml.
providers:
  - name: cluster-api
    type: CoreProvider
    url: https://github.com/kubernetes-sigs/cluster-api/releases/latest/core-components.yaml
  - name: talos
    type: BootstrapProvider
    url: https://github.com/siderolabs/cluster-api-bootstrap-provider-talos/releases/latest/bootstrap-components.yaml
  - name: talos
    type: ControlPlaneProvider
    url: https://github.com/siderolabs/cluster-api-control-plane-provider-talos/releases/latest/control-plane-components.yaml
  - name: proxmox
    type: InfrastructureProvider
    url: https://github.com/ionos-cloud/cluster-api-provider-proxmox/releases/latest/infrastructure-components.yaml
  - name: in-cluster
    type: IPAMProvider
    url: https://github.com/kubernetes-sigs/cluster-api-ipam-provider-in-cluster/releases/latest/ipam-components.yaml

# Pas de feature gates expérimentales (identique au rendu gitops/platform/capi-providers).
CLUSTER_TOPOLOGY: "false"
EXP_MACHINE_POOL: "false"
EXP_RUNTIME_SDK: "false"
CAPMOX_LOGLEVEL: "2"
