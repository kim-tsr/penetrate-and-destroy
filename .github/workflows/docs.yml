name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "apps/ctfd/API.md"
      - "monitoring/rules/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "apps/ctfd/API.md"
      - "monitoring/rules/**"
      - ".github/workflows/docs.yml"

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dépendances (versions exactes)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --no-cache-dir -r docs/requirements.txt
      - name: Un runbook par alerte
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/venv/bin/python" monitoring/scripts/validate.py runbooks | cut -f1 | while read -r f; do
            test -f "$f" || { echo "runbook manquant : $f"; exit 1; }
          done
      - name: mkdocs build --strict
        run: '"$RUNNER_TEMP/venv/bin/mkdocs" build --strict'

  # Déploiement GitHub Pages (branche gh-pages), désactivé par défaut :
  # définir la variable de dépôt PAD_DOCS_DEPLOY=true puis activer Pages sur la branche gh-pages.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAD_DOCS_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Dépendances (versions exactes)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --no-cache-dir -r docs/requirements.txt
      - name: Publier sur gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          "$RUNNER_TEMP/venv/bin/mkdocs" gh-deploy --force --strict
