name: images

on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ctfd, context: apps/ctfd, dockerfile: apps/ctfd/Dockerfile, build_contexts: 'schema=challenges/schema' }
          - { name: frontend, context: apps/frontend, dockerfile: apps/frontend/Dockerfile }
          - { name: netbird-sync, context: apps/netbird-sync, dockerfile: apps/netbird-sync/Dockerfile }
          - { name: chall-manager-scenario, context: apps/chall-manager-scenario, dockerfile: apps/chall-manager-scenario/Dockerfile }
          - { name: chal-pwn-ret2win-instanced, context: challenges/pwn-ret2win-instanced, dockerfile: challenges/pwn-ret2win-instanced/Dockerfile }
          - { name: chal-web-sqli-instanced, context: challenges/web-sqli-instanced, dockerfile: challenges/web-sqli-instanced/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dockerfile présent ?
        id: df
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          if [ -f "$DOCKERFILE" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.name }} : Dockerfile absent, ignoré" >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.df.outputs.present == 'true'
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - if: steps.df.outputs.present == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.df.outputs.present == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Ordre imposé par scripts/build-image.sh : build -> scan Trivy bloquant (HIGH/CRITICAL corrigeables)
      # -> push -> signature cosign. Un scan en échec empêche tout push et toute signature.
      - name: Build, scan Trivy, push, sign
        if: steps.df.outputs.present == 'true'
        id: build
        env:
          SCAN: '1'
          PUSH: '1'
          SIGN: '1'
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          BUILD_CONTEXTS: ${{ matrix.build_contexts }}
          NAME: ${{ matrix.name }}
          CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          set -euo pipefail
          ref=$(nix develop -c scripts/build-image.sh "$NAME" "$CONTEXT" "$DOCKERFILE" | tail -n1)
          if [ -z "$ref" ]; then
            echo "référence d'image vide" >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Résumé du digest
        if: steps.df.outputs.present == 'true'
        env:
          REF: ${{ steps.build.outputs.ref }}
          NAME: ${{ matrix.name }}
        run: |
          {
            echo "### $NAME"
            echo '```'
            echo "$REF"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Épingle les empreintes publiées dans les manifests (gitops/apps/*/deployment.yaml, challenges/*/challenge.yml) et
  # ouvre/met à jour UNE PR `ci/pin-image-digests`. Seulement sur main, une fois toutes les images publiées et signées.
  # Secret optionnel PAD_BOT_TOKEN (PAT ou token d'app, droits contents+pull-requests) : sans lui, la PR est créée avec
  # GITHUB_TOKEN, ce qui exige le réglage « Allow GitHub Actions to create and approve pull requests » et ne déclenche
  # pas la CI sur la PR (limite GitHub) ; avec lui, la CI s'exécute normalement.
  pin-digests:
    needs: build
    if: github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(images)')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.PAD_BOT_TOKEN || github.token }}
          persist-credentials: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Réécrire les empreintes
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          tag=$(git rev-parse --short HEAD)
          scripts/pin-image-digests.sh "$owner" "$tag" | tee "$RUNNER_TEMP/changed.txt"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Commit, push et PR
        env:
          GH_TOKEN: ${{ secrets.PAD_BOT_TOKEN || github.token }}
          BRANCH: ci/pin-image-digests
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Empreintes déjà à jour" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add gitops/apps challenges
          git commit -m "chore(images): épingler les empreintes des images ${TAG}"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore(images): épingler les empreintes des images" \
              --body "Empreintes publiées par images.yml (tag ${TAG}), réécrites par scripts/pin-image-digests.sh. Relire, puis fusionner : ArgoCD déploie ensuite. Voir docs/operations/images-signees.md."
          else
            gh pr edit "$BRANCH" --title "chore(images): épingler les empreintes des images" \
              --body "Empreintes publiées par images.yml (tag ${TAG}), réécrites par scripts/pin-image-digests.sh. Voir docs/operations/images-signees.md."
          fi
