version: "3"

# Documentation (MkDocs Material). Incluse par le Taskfile racine sous le préfixe `docs:`.
# Le venv `.venv-docs` (ignoré par Git) est créé au besoin et reçoit docs/requirements.txt (versions exactes).

vars:
  VENV: "{{.ROOT_DIR}}/.venv-docs"
  REQS: "{{.ROOT_DIR}}/docs/requirements.txt"

tasks:
  venv:
    desc: Crée .venv-docs et y installe docs/requirements.txt si absent ou périmé
    dir: "{{.ROOT_DIR}}"
    status:
      - test -x {{.VENV}}/bin/mkdocs
      - cmp -s {{.REQS}} {{.VENV}}/requirements.installed
    cmds:
      - python3 -m venv {{.VENV}}
      - "{{.VENV}}/bin/pip install --no-cache-dir -r {{.REQS}}"
      - cp {{.REQS}} {{.VENV}}/requirements.installed

  serve:
    desc: "Aperçu local de la documentation sur http://127.0.0.1:8000 (rechargement automatique)"
    dir: "{{.ROOT_DIR}}"
    deps: [venv]
    cmds:
      - "{{.VENV}}/bin/mkdocs serve --dev-addr 127.0.0.1:8000"

  build:
    desc: "Construit la documentation dans site/ (mkdocs build --strict, comme la CI)"
    dir: "{{.ROOT_DIR}}"
    deps: [venv]
    cmds:
      - "{{.VENV}}/bin/mkdocs build --strict"
