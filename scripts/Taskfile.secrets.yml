version: "3"

# Secrets SOPS + age (namespace `secrets:` du Taskfile racine). Voir docs/SECRETS.md.
# Tout passe par scripts/sopsctl.py (bibliothèque standard) ; aucune valeur n'est écrite en clair sur disque.

tasks:
  keys:
    desc: "Génère (hors repo) les clés age opérateur et cluster et renseigne les recipients de .sops.yaml"
    cmds:
      - python3 {{.ROOT_DIR}}/scripts/sopsctl.py keys

  init:
    desc: "Crée les *.sops.yaml manquants depuis les *.example.yaml (valeurs aléatoires, CHANGEME pour l'externe) ; jamais de réécriture"
    cmds:
      - python3 {{.ROOT_DIR}}/scripts/sopsctl.py init {{.CLI_ARGS}}

  pending:
    desc: "Liste les valeurs encore à CHANGEME dans les *.sops.yaml (noms de clés uniquement)"
    cmds:
      - python3 {{.ROOT_DIR}}/scripts/sopsctl.py pending

  check:
    desc: "Vérifie examples/sops, absence de CHANGEME, de clé ou fichier en clair suivi par git, structure chiffrée"
    cmds:
      - python3 {{.ROOT_DIR}}/scripts/sopsctl.py check {{.CLI_ARGS}}

  check-structure:
    desc: "Garde-fou sans clé (identique à la CI) : blocs sops:, valeurs ENC[...], pas de Secret ni de clé en clair"
    cmds:
      - "{{.ROOT_DIR}}/scripts/check-sops.sh"

  update-keys:
    desc: "Applique les recipients de .sops.yaml à tous les *.sops.yaml (sops updatekeys), p. ex. après ajout de la clé du cluster"
    cmds:
      - python3 {{.ROOT_DIR}}/scripts/sopsctl.py update-keys

  rotate-cluster-key:
    desc: "Nouvelle clé age du cluster : recipient remplacé, updatekeys + rotation des clés de données gitops/**"
    cmds:
      - python3 {{.ROOT_DIR}}/scripts/sopsctl.py rotate-cluster-key

  validate-gitops:
    desc: "kustomize build + kubeconform de gitops/ avec des sops factices (clé age éphémère, jamais la vraie)"
    cmds:
      - "{{.ROOT_DIR}}/scripts/validate-gitops.sh {{.CLI_ARGS}}"
