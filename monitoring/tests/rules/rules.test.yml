      - eval_time: 10m
        alertname: InstancesLBPoolExhausted
        exp_alerts: []

  # --- Soumissions CTFd : max par résultat, pas de doublon entre réplicas ---
  - interval: 1m
    input_series:
      - series: 'ctfd_submissions_total{result="correct", pod="ctfd-0"}'
        values: "0+6x10"
      - series: 'ctfd_submissions_total{result="correct", pod="ctfd-1"}'
        values: "0+6x10"
    promql_expr_test:
      - expr: pad:ctfd_solves_per_minute
        eval_time: 10m
        exp_samples:
          - labels: "pad:ctfd_solves_per_minute"
            value: 6

  # --- Sessions du front : max() et non sum() ---
  - interval: 1m
    input_series:
      - series: 'pad_frontend_active_sessions{pod="front-0"}'
        values: "42+0x5"
      - series: 'pad_frontend_active_sessions{pod="front-1"}'
        values: "42+0x5"
    promql_expr_test:
      - expr: pad:frontend_active_sessions
        eval_time: 2m
        exp_samples:
          - labels: "pad:frontend_active_sessions"
            value: 42

  # --- Alertmanager : notifications en échec ---
  - interval: 1m
    input_series:
      - series: 'alertmanager_notifications_failed_total{integration="discord"}'
        values: "0+1x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              integration: discord
            exp_annotations:
              summary: "Alertmanager n'arrive pas à notifier via discord"
              description: "Les notifications discord (Discord ou e-mail) échouent : webhook ou SMTP à vérifier. Le canal restant peut suffire à être prévenu."
              runbook_url: docs/runbooks/alertmanager-notifications.md
