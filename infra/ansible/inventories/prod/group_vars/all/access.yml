---
# Chemin d'accès SSH aux LXC, configurable par variable d'environnement (ou -e) :
#   proxmox (défaut) : ProxyJump via l'hôte Proxmox (ssh_user@ssh_host de secrets/site.sops.yaml). Utilisé au bootstrap,
#                      avant que Warpgate n'existe. L'hôte route vers les zones via OPNsense.
#   bastion          : via Warpgate (staff connecté à NetBird). Warpgate n'est pas un jump host TCP : on s'y connecte
#                      en SSH avec l'utilisateur "<user>:<target>" ; la target = "lxc-<inventory_hostname>" (stack 50-warpgate).
#                      Warpgate lui-même n'a pas de target : le joindre en mode proxmox.
#   direct           : connexion directe aux IPs du contrat (poste déjà dans une zone routée, CI interne...).
pad_access_mode: "{{ lookup('ansible.builtin.env', 'PAD_ACCESS_MODE') | default('proxmox', true) }}"
pad_proxmox_jump: "{{ lookup('ansible.builtin.env', 'PAD_PROXMOX_JUMP') | default(pad_site.ssh_user ~ '@' ~ pad_site.ssh_host, true) }}"
# Rebond multiplexé : UNE connexion SSH authentifiée vers l'hôte, partagée par toutes les connexions aux LXC. Sans cela,
# chaque connexion Ansible ouvre sa propre session sur l'hôte et OpenSSH >= 9.8 (PerSourcePenalties, défaut sous
# Debian 13 / Proxmox 9) finit par refuser temporairement le poste (« Connection timed out during banner exchange »).
pad_jump_control_path: "~/.ansible/cp/pad-jump-{{ pad_proxmox_jump | hash('sha1') | truncate(12, True, '') }}"
pad_bastion_user: "{{ lookup('ansible.builtin.env', 'PAD_BASTION_USER') | default('ansible', true) }}"
pad_bastion_host: "{{ pad.services.warpgate.ip }}"
pad_bastion_port: "{{ pad.ports.warpgate.ssh }}"
# Utilisateur des LXC : root avec la clé injectée par tofu (PermitRootLogin prohibit-password).
pad_lxc_user: root

pad_is_lxc: "{{ 'proxmox_host' not in group_names }}"

ansible_user: >-
  {{ (pad_bastion_user ~ ':lxc-' ~ inventory_hostname) if (pad_is_lxc and pad_access_mode == 'bastion') else pad_lxc_user }}
ansible_port: "{{ pad_bastion_port if (pad_is_lxc and pad_access_mode == 'bastion') else 22 }}"
ansible_ssh_common_args: >-
  {{ '' if (not pad_is_lxc or pad_access_mode == 'direct')
     else ('-o HostName=' ~ pad_bastion_host ~ ' -o HostKeyAlias=warpgate') if pad_access_mode == 'bastion'
     else ('-o ProxyCommand="ssh -o BatchMode=yes -o ControlMaster=auto -o ControlPersist=300 -o ControlPath='
           ~ pad_jump_control_path ~ ' -W %h:%p ' ~ pad_proxmox_jump ~ '"') }}
