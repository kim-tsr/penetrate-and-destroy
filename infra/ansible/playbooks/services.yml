---
# Phase 2 de `task up` : services des LXC (tofu 20-services-lxc a créé les conteneurs et l'inventaire généré).
# Un play par LXC, ciblé sur le groupe svc_<service> de l'inventaire. Ordre :
#   1. monitoring : reçoit la télémétrie (Alloy) des autres LXC dès leur déploiement ;
#   2. authentik  : IdP, requis par les rôles warpgate et netbird (SSO / connecteur OIDC) ;
#   3. warpgate   : bastion ;
#   4. netbird    : VPN (IdP Authentik ajouté via l'API) ;
#   5. edge       : dernier, ses backends (authentik, netbird) existent déjà quand Traefik demande les certificats ACME.
#   6. routing peers NetBird (tag netbird-agent, jamais joués sans ce tag) : phase 11 uniquement, car ils exigent les setup keys
#      créées par la stack tofu 40-netbird (task netbird:sync-keys). /dev/net/tun est d'abord ajouté aux LXC depuis l'hôte Proxmox.
# Chaque play : base-hardening (sans Alloy, posé ensuite avec la découverte Docker), docker, alloy, rôle du service.
# Secrets : chaque rôle de service déchiffre lui-même secrets/<service>.sops.yaml (community.sops, sur le contrôleur) ;
# les valeurs de site (secrets/site.sops.yaml) ne sont lues qu'à la connexion (access.yml). Un pré-contrôle échoue tôt
# si le fichier chiffré du service est absent.
# Tags : un par service (monitoring, authentik, warpgate, netbird, edge, netbird-agent) + base, docker, alloy, service.
# Exemple : task ansible:services -- --tags edge --limit edge
- name: Vérifier l'inventaire des LXC
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]
  tasks:
    - name: Exiger un groupe svc_<service> à un seul hôte pour chaque service du contrat
      ansible.builtin.assert:
        that: groups['svc_' ~ item] | default([]) | length == 1
        fail_msg: >-
          Le groupe svc_{{ item }} est absent ou ne contient pas exactement un hôte :
          relancer tofu (stack 20-services-lxc) pour régénérer inventories/prod/hosts.generated.yml.
        quiet: true
      loop: "{{ pad.services.keys() | list }}"

- name: Déployer la stack de monitoring
  hosts: svc_monitoring
  become: true
  gather_facts: true
  any_errors_fatal: true
  serial: 1
  tags: [monitoring]
  vars:
    base_hardening_alloy_enabled: false   # Alloy est posé explicitement après Docker (découverte des conteneurs)
    alloy_docker_enabled: true
  pre_tasks:
    - name: Rechercher le secret chiffré monitoring.sops.yaml
      ansible.builtin.stat:
        path: "{{ pad_secrets_dir }}/monitoring.sops.yaml"
      delegate_to: localhost
      become: false
      register: services_secret_file

    - name: Exiger le secret chiffré (task secrets:init, voir docs/SECRETS.md)
      ansible.builtin.assert:
        that: services_secret_file.stat.exists
        fail_msg: "secrets/monitoring.sops.yaml absent (modèle : secrets/monitoring.example.yaml)."
        quiet: true
  roles:
    - { role: base-hardening, tags: [base] }
    - { role: docker, tags: [docker] }
    - { role: alloy, tags: [alloy] }
    - { role: monitoring-stack, tags: [service] }

