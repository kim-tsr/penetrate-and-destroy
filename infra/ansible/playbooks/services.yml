# --- Routing peers NetBird (phase 11) ----------------------------------------------------------------------------------
# `never` : ces plays ne tournent que sur demande explicite (--tags netbird-agent), après `task netbird:sync-keys`.
- name: Autoriser /dev/net/tun dans les LXC routing peers (depuis l'hôte Proxmox)
  hosts: proxmox_host
  become: true
  gather_facts: false
  any_errors_fatal: true
  tags: [netbird-agent, never]
  roles:
    - { role: lxc-tun, tags: [lxc-tun] }

- name: Enrôler le routing peer NetBird de la zone CHALLENGES (LXC nbrouter)
  hosts: svc_nbrouter
  become: true
  gather_facts: true
  any_errors_fatal: true
  serial: 1
  tags: [netbird-agent, never]
  vars:
    netbird_agent_zone: challenges
    alloy_docker_enabled: false
  pre_tasks:
    - name: Attendre le LXC (redémarré par lxc-tun)
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 180

    - name: Rechercher le secret chiffré netbird-agent.sops.yaml
      ansible.builtin.stat:
        path: "{{ pad_secrets_dir }}/netbird-agent.sops.yaml"
      delegate_to: localhost
      become: false
      register: services_secret_file

    - name: Exiger le secret chiffré (task secrets:init puis task netbird:sync-keys)
      ansible.builtin.assert:
        that: services_secret_file.stat.exists
        fail_msg: "secrets/netbird-agent.sops.yaml absent (modèle : secrets/netbird-agent.example.yaml)."
        quiet: true
  roles:
    - { role: base-hardening, tags: [base] }
    - { role: netbird-agent, tags: [service] }

- name: Enrôler le routing peer NetBird de la zone BASTION (agent sur le LXC warpgate)
  hosts: svc_warpgate
  become: true
  gather_facts: true
  any_errors_fatal: true
  serial: 1
  tags: [netbird-agent, never]
  vars:
    netbird_agent_zone: bastion
  pre_tasks:
    - name: Attendre le LXC (redémarré par lxc-tun)
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 180

    - name: Rechercher le secret chiffré netbird-agent.sops.yaml
