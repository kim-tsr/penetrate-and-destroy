# Configuration Ansible de PenetrateAndDestroy.
# Chargée explicitement par le Taskfile (ANSIBLE_CONFIG), le répertoire courant pouvant être world-writable en CI.
[defaults]
# Produit par tofu (stack 20-services-lxc). Voir hosts.example.yml pour le format.
inventory = inventories/prod/hosts.generated.yml
roles_path = roles
collections_path = .collections
# Reproductibilité : ignorer les collections embarquées par le paquet "ansible" (pip/brew/nix), seules celles
# de requirements.yml (installées dans .collections/) sont utilisées.
collections_scan_sys_path = false
forks = 10
gathering = smart
fact_caching = jsonfile
fact_caching_connection = ../../.state/ansible-facts
fact_caching_timeout = 3600
interpreter_python = auto_silent
stdout_callback = default
callback_result_format = yaml
retry_files_enabled = false
host_key_checking = true
nocows = true

[ssh_connection]
pipelining = true
# accept-new : la clé d'hôte des LXC change à chaque rebuild (plateforme jetable), sans jamais accepter une clé modifiée en cours de vie.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30
control_path_dir = ~/.ansible/cp

[diff]
always = false
