---
- name: Régénérer l'initramfs
  ansible.builtin.command: update-initramfs -u -k all
  changed_when: true

- name: Recharger pad-nat
  ansible.builtin.systemd_service:
    name: pad-nat
    state: restarted

- name: Redémarrer pve-exporter
  ansible.builtin.systemd_service:
    name: prometheus-pve-exporter
    state: restarted
