---
- name: Recharger sshd
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded

- name: Redémarrer journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted

- name: Redémarrer node-exporter
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    state: restarted
