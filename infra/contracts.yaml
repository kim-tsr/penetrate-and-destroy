# Source unique de vérité partagée par tofu, ansible, gitops et apps.
# Toute IP, nom DNS, groupe ou port utilisé ailleurs DOIT venir d'ici.
# Les valeurs marquées CHANGEME sont à fournir avant le déploiement réel.
# Les valeurs propres au site (URL de l'API Proxmox, accès SSH à l'hôte, IP publique, passerelle, MAC) ne sont pas
# ici : elles sont fournies par l'opérateur dans secrets/site.sops.yaml (modèle : secrets/site.example.yaml).

project: penetrate-and-destroy
domain: CHANGEME.example.net           # domaine public de la plateforme (ex. lab.mondomaine.fr) : ctf.<domain>, auth.<domain>...
dns_zone: ""                            # zone DNS OVH qui le contient (ex. mondomaine.fr) ; vide = domain lui-même
internal_domain: pad.internal           # domaine de recherche interne (OPNsense, LXC) ; non publié
git:
  repo: https://github.com/kim-tsr/penetrate-and-destroy.git
  # SSH sur le port 443 (ssh.github.com) : les zones n'ont d'egress Internet qu'en 80/443. Suivi par ArgoCD (clé de déploiement).
  ssh: ssh://git@ssh.github.com:443/kim-tsr/penetrate-and-destroy.git
  branch: main

host:
  node: pve                              # nom du node Proxmox (défaut de l'installeur) ; autre nom : task site:node -- <nom>
  wan_bridge: vmbr0
  zones_bridge: vmbr2                   # VLAN-aware, pas d'uplink
  transit_bridge: vmbr1                 # uniquement en mode wan=nat
  datastore_vm: local-zfs               # stockage des disques de VM/LXC ; autre nom : task site:set -- datastore_vm=<nom>
  datastore_vm_type: zfspool            # zfspool | lvmthin | lvm | dir : type de ce stockage (task site:set -- datastore_vm_type=...)
  datastore_iso: local
  zfs_arc_max_bytes: 4294967296         # 4 GiB
  mgmt_ip: 10.20.10.2                   # IP de l'hôte sur vmbr2.10 (API Proxmox pour CAPMOX/CSI, accès tofu -> OPNsense)
                                        # route retour 10.20.0.0/16 via zones.mgmt.gw à poser sur l'hôte (ansible host-tuning)

wan:
  mode: routed_ip                       # routed_ip : IP publique supplémentaire routée vers la VM routeur (MAC dédiée si l'hébergeur l'exige)
                                        # nat       : IP publique de l'hôte, DNAT nftables vers le routeur via le transit
                                        # IP publique, passerelle et MAC : secrets/site.sops.yaml (wan.*)
  transit_cidr: 10.255.0.0/30           # mode nat : host .1, opnsense .2
  public_ports:
    - { port: 443, proto: tcp, to: edge }
    - { port: 80,  proto: tcp, to: edge }          # redirection -> 443 / ACME
    - { port: 3478, proto: udp, to: netbird }      # STUN/TURN
    - { port: "49152-49252", proto: udp, to: netbird }  # TURN relay range

zones:
  mgmt:       { vlan: 10, cidr: 10.20.10.0/24, gw: 10.20.10.1 }
  dmz:        { vlan: 20, cidr: 10.20.20.0/24, gw: 10.20.20.1 }
  bastion:    { vlan: 30, cidr: 10.20.30.0/24, gw: 10.20.30.1 }
  identity:   { vlan: 40, cidr: 10.20.40.0/24, gw: 10.20.40.1 }
  monitoring: { vlan: 50, cidr: 10.20.50.0/24, gw: 10.20.50.1 }
  prod:       { vlan: 60, cidr: 10.20.60.0/24, gw: 10.20.60.1 }
  challenges: { vlan: 70, cidr: 10.20.70.0/24, gw: 10.20.70.1 }

dns_resolver: 10.20.10.1                # Unbound sur OPNsense (toutes les zones utilisent le .1 de leur VLAN)

flow_ports:          # ports de la matrice de flux (stack 60-opnsense-rules) ; plages au format "a-b"
  ssh: 22
  http: 80
  https: 443
  dns: 53
  ntp: 123
  kube_api: 6443
  talos_api: 50000
  talos_trustd: 50001
  kubelet: 10250
  proxmox_api: 8006
  warpgate: [2222, 8888]                 # SSH, HTTPS (défauts Warpgate)
  monitoring_push: [8428, 3100, 4317, 4318]   # VictoriaMetrics, Loki, OTLP gRPC, OTLP HTTP
  monitoring_scrape: ["9000-9999", 10249, 10250, 12345]   # exporters, kube-proxy/kubelet, Alloy
  uptime_kuma: 3001                      # status page publique (edge -> monitoring)
  cilium: { vxlan_udp: 8472, wireguard_udp: 51871, health_tcp: 4240, hubble_tcp: 4244 }

router:
  vmid: 200
  name: opnsense
  version: "25.7"
  cores: 2
  memory_mb: 1536
  disk_gb: 16

services:            # LXC non privilégiés, Debian 13, Docker Compose
  edge:       { vmid: 210, zone: dmz,        ip: 10.20.20.10, cores: 1, memory_mb: 512,  disk_gb: 8 }
  netbird:    { vmid: 211, zone: dmz,        ip: 10.20.20.11, cores: 1, memory_mb: 1024, disk_gb: 8 }
  warpgate:   { vmid: 230, zone: bastion,    ip: 10.20.30.10, cores: 1, memory_mb: 512,  disk_gb: 4, tun: true }   # tun : /dev/net/tun (agent NetBird, routing peer BASTION)
  authentik:  { vmid: 240, zone: identity,   ip: 10.20.40.10, cores: 2, memory_mb: 1536, disk_gb: 12 }
  monitoring: { vmid: 250, zone: monitoring, ip: 10.20.50.10, cores: 2, memory_mb: 3072, disk_gb: 60 }
  nbrouter:   { vmid: 270, zone: challenges, ip: 10.20.70.10, cores: 1, memory_mb: 512,  disk_gb: 4, tun: true }   # routing peer NetBird de la zone CHALLENGES (netbird.routing_peer_service)

kubernetes:
  cluster_name: pad-prod
  talos_version: v1.11.3
  kubernetes_version: v1.34.1
  control_plane_endpoint: 10.20.60.5     # VIP Talos
  vmid_range: [300, 399]
  control_plane: { replicas: 1, cores: 2, memory_mb: 2560, disk_gb: 20, ip_pool: [10.20.60.10, 10.20.60.14] }
  pools:
    platform:   { zone: prod,       replicas: 2, cores: 2, memory_mb: 3584, disk_gb: 40, ip_pool: [10.20.60.20, 10.20.60.39] }
    challenges: { zone: challenges, min: 1, max: 3, cores: 2, memory_mb: 2560, disk_gb: 30, ip_pool: [10.20.70.20, 10.20.70.39],
                  taint: "pad.io/pool=challenges:NoSchedule" }
  pod_cidr: 10.244.0.0/16
  service_cidr: 10.96.0.0/12
  lb_pools:
    ingress:   [10.20.60.200, 10.20.60.220]   # Traefik interne du cluster = 10.20.60.200
    instances: [10.20.70.100, 10.20.70.199]   # IPs des instances de challenges (joignables via NetBird)
  # Cilium LB-IPAM choisit le pool par serviceSelector (pas d'annotation de pool côté Cilium) :
  # chaque CiliumLoadBalancerIPPool sélectionne les Services portant ce label = nom du pool.
  lb_pool_label: pad.io/lb-pool
  ingress_ip: 10.20.60.200
  # Template VM Talos créé par tofu (stack 15-talos-image), cloné par CAPMOX. Source unique du VMID (stack 15 + templateID des manifests CAPI) ; volontairement hors vmid_range (299 < 300) pour ne jamais être alloué par CAPMOX.
  talos_template: { name: talos-v1.11.3-template, vmid: 299 }
  # Schematic Image Factory : siderolabs/qemu-guest-agent uniquement (POST https://factory.talos.dev/schematics).
  talos_schematic_id: ce4c980550dd2ab1b17bbf2b08801c7eb59418eafe8f279833297925d67c7515
  talos_installer_image: factory.talos.dev/nocloud-installer/ce4c980550dd2ab1b17bbf2b08801c7eb59418eafe8f279833297925d67c7515:v1.11.3
  capi:                                   # providers clusterctl épinglés (bootstrap + gitops/platform/capi-providers)
    core: v1.14.3                         # cluster-api (contrat v1beta2 ; mgmt k8s v1.33 -> v1.36)
    bootstrap_talos: v0.6.13              # CABPT (contrat v1beta1, toléré jusqu'à CAPI v1.16)
    control_plane_talos: v0.5.14          # CACPPT (contrat v1beta1)
    infrastructure_proxmox: v0.9.1        # CAPMOX ionos-cloud (contrat v1beta2)
    ipam_in_cluster: v1.1.1
  capi_namespace: pad-cluster             # namespace des objets Cluster/Machine* du cluster prod
  kind_version: v0.33.0                   # cluster de bootstrap éphémère (image ci-dessous = release notes kind v0.33.0)
  kind_node_image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d

acme:                                     # cert-manager (ClusterIssuers ACME DNS-01 via webhook OVH)
  email: CHANGEME@CHANGEME.example.net
  ovh_endpoint: ovh-eu                    # ovh-eu | ovh-ca selon le compte OVH qui porte la zone DNS
  webhook_group_name: acme.pad.io

public_hostnames: [front, auth, vpn, status]   # clés de `hostnames` servies par l'edge : A publics (70-dns) ET overrides Unbound vers l'IP interne de l'edge (split-DNS, 60-opnsense-rules)

hostnames:          # sous-domaines de `domain`
  front:      ctf          # public  -> edge -> 10.20.60.200
  auth:       auth         # public  -> edge -> authentik
  vpn:        vpn          # public  -> edge -> netbird
  bastion:    bastion      # interne (NetBird staff) -> warpgate
  grafana:    grafana      # interne via bastion/forward-auth
  argocd:     argocd       # interne
  ctfd_admin: ctfd-admin   # interne (UI admin CTFd brute, secours)
  registry:   registry     # interne
  status:     status       # public (Uptime Kuma status page)
  vmetrics:   vm           # interne (forward-auth Authentik)
  alertmanager: alertmanager # interne (forward-auth Authentik)
  hubble:     hubble       # interne (forward-auth Authentik)
  proxmox:    pve          # interne via bastion (OIDC Authentik)

identity:
  provider: authentik
  groups:
    - ctf-players
    - ctf-managers
    - ctf-admins
    - infra-admins
  oidc_clients:      # client_id ; secrets générés et stockés via SOPS
    frontend: pad-frontend
    netbird: pad-netbird
    warpgate: pad-warpgate
    grafana: pad-grafana
    argocd: pad-argocd
    proxmox: pad-proxmox
    ctfd: pad-ctfd

netbird:
  groups:
    players: ctf-players
    staff: infra-admins
  routing_peer_zone: challenges
  routing_peer_service: nbrouter          # LXC dédié en zone CHALLENGES (services.nbrouter) ; agent NetBird, masquerade
  routing_peer_ip: 10.20.70.10            # = services.nbrouter.ip (source vue par les instances : PAD_FROM_CIDRS)
  overlay_cidr: 100.64.0.0/10             # plage CGNAT par défaut des peers NetBird
  api_url: https://vpn.CHANGEME.example.net/api   # = hostnames.vpn + domain (API management NetBird)
  team_group_prefix: "ctf-team-"           # groupe NetBird par équipe CTFd : ctf-team-<team_id>
  network_name: pad-instances              # Network NetBird portant les resources d'instances
  bastion_routing_peer_service: warpgate  # agent NetBird sur le LXC warpgate
  bastion_routing_peer_ip: 10.20.30.10    # = services.warpgate.ip
  bastion_network_name: pad-bastion        # Network NetBird de la zone BASTION (staff uniquement)
  technical_groups:
    routers_challenges: pad-routers-challenges
    routers_bastion: pad-routers-bastion
    bastion_resources: pad-bastion

namespaces:
  ctfd: ctfd
  frontend: frontend
  chall_manager: chall-manager
  instances_prefix: inst-                 # un namespace par instance
  monitoring_agents: observability
  registry: registry
  storage: storage
  netbird_sync: netbird-sync

apps:              # endpoints internes consommés par les apps (ClusterIP)
  ctfd:
    service: http://ctfd.ctfd.svc.cluster.local:8000
    upload_bucket: ctfd-uploads
    backup_bucket: backups
  chall_manager:
    service: http://chall-manager.chall-manager.svc.cluster.local:8080
    generic_scenario: registry.pad.internal/pad/scenarios/k8s-instance   # scénario générique (OCI)
  garage:
    s3_endpoint: http://garage.storage.svc.cluster.local:3900
    region: garage
  valkey: valkey.storage.svc.cluster.local:6379
  ingress_class: traefik             # entrypoint websecure, TLS par défaut de Traefik
  registry: registry.pad.internal    # Zot (= hostnames.registry + internal_domain)

instances:         # politique d'isolation des instances de challenges (scénario chall-manager, Kyverno, kubelet)
  image_prefix: registry.pad.internal/ctf/   # seul registre/chemin accepté pour les images d'instance (= apps.registry + /ctf/) ; empreinte @sha256 obligatoire
  limits_max: { cpu: "2", memory: 1Gi, ephemeral_storage: 1Gi }   # plafonds par conteneur (ParseConfig) ; ResourceQuota = 2 x ces plafonds
  pod_pids_limit: 256                    # kubelet podPidsLimit du pool challenges (anti fork bomb)
  max_pods_per_node: 40                  # kubelet maxPods du pool challenges
  max_per_team: 3                        # instances simultanées par équipe (ou joueur en mode individuel) : PAD_INSTANCES_MAX_PER_SOURCE (plugin chall_manager_bridge)
  max_total: 90                          # instances simultanées sur la plateforme, préchauffées comprises : PAD_INSTANCES_MAX_TOTAL ; < taille du pool LB-IPAM `instances`
                                         # (100 IP) pour garder de la marge (courses, instances staff). Refus 503 côté joueur ; managers/admins exemptés.
  host_users: false                      # false = user namespace par pod (K8s >= 1.33, noyau Talos récent) ; true = désactivé (échappatoire)
  image_verification: audit              # audit | enforce : vérification cosign (Kyverno verify-images) ; enforce seulement une fois la clé réelle fournie
                                         # (ConfigMap kyverno/pad-image-policy : mode + clé publique ; voir docs/operations/images-signees.md)

monitoring:
  remote_write: http://10.20.50.10:8428/api/v1/write   # VictoriaMetrics
  loki_push: http://10.20.50.10:3100/loki/api/v1/push
  otlp_grpc: 10.20.50.10:4317                            # Tempo
  grafana_port: 3000
  # Exporters scrapés par VictoriaMetrics (MONITORING -> toutes zones, scrape uniquement).
  exporters:
    node: 9100            # node-exporter : hôte + chaque LXC
    alloy: 12345          # UI/metrics Alloy : hôte + chaque LXC
    pve: 9221             # prometheus-pve-exporter : hôte uniquement
    docker: 9323          # métriques dockerd (daemon.json metrics-addr) : chaque LXC
    opnsense: { target: 10.20.10.1, port: 9100 }   # plugin os-node_exporter d'OPNsense (IP MGMT)
  host_target: 10.20.10.2  # IP de l'hôte Proxmox sur vmbr2.10 (MGMT), utilisée pour scraper pve/node de l'hôte

# Ports d'écoute des services LXC (consommés par ansible, opnsense-rules et monitoring).
ports:
  edge:
    http: 80
    https: 443
    metrics: 8082          # Traefik entrypoint "metrics"
    crowdsec_metrics: 6060  # LAPI (8080) et AppSec (7422) restent internes au réseau docker du LXC
  netbird:
    http: 80               # netbird-server combiné (management + signal + relay, HTTP/h2c derrière edge)
    stun: 3478             # UDP, exposé publiquement
    metrics: 9090
    dashboard: 8080
    turn_relay_range: "49152-49252"   # coturn optionnel (désactivé par défaut)
  warpgate:
    https: 8888
    ssh: 2222              # pas d'exporter Prometheus natif : métriques conteneur via Alloy (cadvisor) + sonde HTTP
  authentik:
    https: 443             # publié sur 443 (-> 9443 du conteneur) : DMZ -> IDENTITY = 443 uniquement
    metrics: 9300
  monitoring:
    victoriametrics: 8428
    vmalert: 8880
    alertmanager: 9093
    loki: 3100
    tempo_http: 3200
    otlp_grpc: 4317
    otlp_http: 4318
    grafana: 3000
    uptime_kuma: 3001
